<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Pet Care World — Moderation</title><style>body{font:16px/1.5 system-ui;color:#18352d;background:#e6f0e8;max-width:960px;margin:auto;padding:20px}header,.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.grow{flex:1}section,article{padding:20px;background:white;border:1px solid #cdddce;border-radius:16px;margin:16px 0}label{display:block;margin-top:12px}input,select{font:inherit;padding:12px;border:1px solid #b5cfbe;border-radius:10px;max-width:100%;box-sizing:border-box}input{width:100%}button{font:inherit;padding:11px 16px;border:0;border-radius:10px;background:#176b57;color:white;cursor:pointer;margin:8px 8px 0 0}button:disabled{opacity:.5}button.danger{background:#9c3540}a{color:#176b57}.muted{color:#526d60}.report-text{white-space:pre-wrap;overflow-wrap:anywhere}code{overflow-wrap:anywhere}#moderationStatus{padding:12px;background:#fff4d7;border-radius:10px}[hidden]{display:none!important}:focus-visible{outline:3px solid #e6a735;outline-offset:3px}</style><script src="family-policy.js"></script></head><body><header><h1 class="grow">Pet Care World · Moderation</h1><select id="moderatorLanguage" aria-label="Language"><option value="en">🇬🇧 EN</option><option value="sr">🇷🇸 SR</option></select></header><p id="moderationStatus" role="status"></p><section id="moderatorLogin"><h2 data-sr="Prijava moderatora" data-en="Moderator sign-in"></h2><p data-sr="Samo nalog kome je vlasnik projekta dodelio ulogu moderatora može da pristupi prijavama." data-en="Only an account granted the moderator role by the project owner can access reports."></p><form id="moderatorLoginForm"><label for="moderatorEmail">Email</label><input id="moderatorEmail" type="email" autocomplete="username" required><label for="moderatorPassword" data-sr="Lozinka" data-en="Password"></label><input id="moderatorPassword" type="password" autocomplete="current-password" minlength="12" required><button type="submit" data-sr="Prijavi se" data-en="Sign in"></button><button type="button" id="createModeratorAccount" data-sr="Napravi nalog za odobrenje" data-en="Create account for approval"></button><button type="button" id="resetModeratorPassword" data-sr="Zaboravljena lozinka" data-en="Reset password"></button></form></section><section id="moderatorApproval" hidden><h2 data-sr="Potrebno je odobrenje vlasnika projekta" data-en="Project-owner approval required"></h2><p data-sr="Nalog je prijavljen, ali nema moderatorsku ulogu. Prvo potvrdite adresu email porukom. Vlasnik projekta zatim dodeljuje ulogu ovom ID-u:" data-en="You are signed in without a moderator role. Verify your email first. The project owner then grants the role to this ID:"></p><code id="moderatorUid"></code><div><button type="button" id="verifyModeratorEmail" data-sr="Pošalji potvrdu emaila" data-en="Send verification email"></button><button type="button" id="refreshModeratorRole" data-sr="Proveri odobrenje" data-en="Check approval"></button></div><p class="muted" data-sr="Sama registracija ne daje pristup privatnim prijavama." data-en="Creating an account does not grant access to private reports."></p></section><section id="moderatorWorkspace" hidden><div class="row"><h2 class="grow" data-sr="Prijave sadržaja" data-en="Content reports"></h2><button id="refreshReports" data-sr="Osveži prijave" data-en="Refresh reports"></button></div><p class="muted" data-sr="Prikaz najnovijih 100 prijava. Proverite kontekst pre uklanjanja poruke ili blokiranja naloga." data-en="Showing the latest 100 reports. Review context before removing a message or banning an identity."></p><div id="moderatorReports"></div><section id="automaticModeration" hidden><h3 data-sr="Poruke zadržane pre objavljivanja" data-en="Messages held before publication"></h3><button id="refreshHeld" data-sr="Osveži zadržane poruke" data-en="Refresh held messages"></button><div id="heldMessages"></div></section><h3 data-sr="Vrati pristup nalogu" data-en="Unban an identity"></h3><form id="unbanForm"><label for="unbanUid">Firebase UID</label><input id="unbanUid" required maxlength="128"><button data-sr="Ukloni zabranu" data-en="Remove ban"></button></form><h3 data-sr="Evidencija radnji" data-en="Action history"></h3><button id="refreshAudit" data-sr="Prikaži poslednje radnje" data-en="Load recent actions"></button><div id="moderatorAudit"></div></section><button id="moderatorSignOut" hidden data-sr="Odjavi se" data-en="Sign out"></button><p><a href="index.html" data-sr="Nazad u aplikaciju" data-en="Back to app"></a> · <a href="chat-privacy.html" data-sr="Pravila chata" data-en="Chat rules"></a></p><script src="chat-config.js"></script><script type="module" src="moderator.js"></script></body></html>
