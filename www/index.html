<style>
:root{--green:#176b57;--green2:#e5f4ee;--ink:#18352d;--muted:#698078;--bg:#f4f8f6;--line:#dce8e2;--white:#fff;--orange:#f6b44b;--red:#c94e4e;--shadow:0 8px 28px #174b3b0d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 0% 22%,#cee7dc 0,transparent 58%),radial-gradient(ellipse at 100% 68%,#f4e5cb 0,transparent 56%),linear-gradient(160deg,#e5f2ea 0%,#f4eddd 58%,#d9ebe1 100%);background-attachment:fixed;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1100px;margin:auto;min-height:100vh;position:relative;isolation:isolate}.top{background:linear-gradient(110deg,rgba(6,38,39,.72),rgba(8,48,45,.58)),url("pet_care_world_original_logo.png") center 35%/cover no-repeat;color:white;padding:22px 20px 26px;border-radius:0 0 26px 26px}.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:850;font-size:22px;letter-spacing:-.5px}.tag{opacity:.83;font-size:13px}.petselect{display:flex;gap:8px;overflow:auto;margin-top:18px;padding-bottom:2px}.petchip{border:1px solid #ffffff65;color:white;background:#ffffff16;border-radius:15px;padding:9px 13px;white-space:nowrap}.petchip.active{background:white;color:var(--green);font-weight:750}.main{padding:18px 16px 90px}.nav{display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;scroll-padding-left:6px;overscroll-behavior-x:contain;padding:6px;background:#e8f1ec;border-radius:16px;margin-bottom:18px}.nav button{border:0;background:transparent;color:#557267;padding:10px 13px;border-radius:12px;white-space:nowrap;font-weight:650}.nav button.active{background:white;color:var(--green);box-shadow:0 2px 8px #123c2c12}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);min-width:0}.card h3{margin:0 0 10px;font-size:16px}.muted{color:var(--muted)}.small{font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:15px}.stat{background:white;border:1px solid var(--line);padding:14px;border-radius:16px}.stat strong{display:block;font-size:23px;letter-spacing:-.6px}.stat span{font-size:12px;color:var(--muted)}.row{display:flex;gap:12px;align-items:center}.avatar{width:58px;height:58px;border-radius:18px;background:var(--green2);display:grid;place-items:center;font-size:28px;flex-shrink:0;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.grow{flex:1;min-width:0}.pill{display:inline-block;background:var(--green2);color:var(--green);border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700}.btn{border:0;border-radius:12px;padding:10px 14px;background:var(--green);color:white;font-weight:700}.btn.secondary{background:var(--green2);color:var(--green)}.btn.ghost{background:transparent;color:var(--green);border:1px solid var(--line)}.btn.danger{background:#fff0f0;color:var(--red)}.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:2px 0 12px}.sectionhead h2{font-size:20px;margin:0;letter-spacing:-.4px}.item{padding:12px 0;border-bottom:1px solid #edf2ef}.item:last-child{border-bottom:0}.itemtitle{font-weight:750}.due{color:#a76b0c;background:#fff5df}.overdue{color:#b13e3e;background:#fff0f0}.empty{padding:24px 10px;text-align:center;color:var(--muted)}form .fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block;font-size:12px;font-weight:750;color:#547066;margin-bottom:5px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #d8e5de;border-radius:11px;background:#fbfdfc;color:var(--ink);outline:none}input:focus,select:focus,textarea:focus{border-color:#4d9b82;box-shadow:0 0 0 3px #dff1e9}textarea{min-height:78px;resize:vertical}.field.full{grid-column:1/-1}.formactions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.hidden{display:none!important}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #edf2ef;white-space:nowrap}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}.chart{width:100%;height:170px}.notice{background:#fff5df;border:1px solid #f4e1b7;border-radius:14px;padding:12px;margin-bottom:14px;font-size:13px}.footer{text-align:center;color:var(--muted);font-size:12px;margin:24px 0}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#173d31;color:white;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);z-index:10;max-width:90%;display:none}
@media(max-width:650px){.grid{grid-template-columns:1fr}.stats{gap:7px}.stat{padding:11px}.stat strong{font-size:20px}.main{padding:14px 12px 80px}.top{padding:19px 15px 22px}.nav button{padding:9px 11px}.sectionhead h2{font-size:18px}form .fields{grid-template-columns:1fr}.field.full{grid-column:auto}}
select#languageSelect option{color:#18352d;background:#fff}a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}button:focus-visible,a:focus-visible{outline:3px solid #f6b44b;outline-offset:2px}
@media(max-width:560px){.toprow{flex-wrap:wrap;gap:14px}.toprow>div:first-child{flex:1 1 100%}.toprow>div:last-child{width:100%;justify-content:space-between}.brand{font-size:26px;line-height:1.2}.tag{margin-top:6px}.petselect{margin-top:14px}}

<body><div class="app">
<header class="top"><div class="toprow"><div><div class="brand">Pet Care World</div><div class="tag" id="tagline">One World, All Pets</div></div><div style="display:flex;gap:7px;align-items:center"><select id="languageSelect" aria-label="Choose language by flag" style="width:112px;max-width:28vw;background:#ffffff18;color:white;border-color:#ffffff55;padding:8px"><option value="en">🇬🇧 EN</option><option value="sr">🇷🇸 SR</option><option value="de">🇩🇪 DE</option><option value="fr">🇫🇷 FR</option><option value="es">🇪🇸 ES</option><option value="it">🇮🇹 IT</option><option value="pt">🇵🇹 PT</option><option value="tr">🇹🇷 TR</option><option value="ru">🇷🇺 RU</option><option value="zh">🇨🇳 中文</option><option value="ja">🇯🇵 日本語</option><option value="ar">🇸🇦 العربية</option><option value="hi">🇮🇳 हिन्दी</option><option value="nl">🇳🇱 NL</option><option value="pl">🇵🇱 PL</option><option value="id">🇮🇩 ID</option><option value="th">🇹🇭 TH</option><option value="vi">🇻🇳 VI</option><option value="sv">🇸🇪 SV</option><option value="ko">🇰🇷 한국어</option></select></div></div><div class="petselect" id="petChips"></div></header>
<main class="main"><nav class="nav" id="nav">
<button class="active" data-tab="home">Pregled</button><button data-tab="pets">Ljubimci</button><button data-tab="health">Zdravlje</button><button data-tab="diary">Dnevnik</button><button data-tab="food">Ishrana</button><button data-tab="costs">Troškovi</button><button data-tab="reminders">Podsetnici</button><button data-tab="bonding">Druženje i saveti</button><button data-tab="shop">Prodavnica</button><button data-tab="deals">Akcije</button><button data-tab="vets">Veterinari</button><button data-tab="premium">Premium</button><button data-tab="assistant">AI asistent</button>
</nav><div id="content"></div><div class="footer" id="footerNote">Pet Care World • Evidencija ljubimaca ostaje na uređaju. Chat poruke su javne. <a href="privacy.html" target="_blank" rel="noopener noreferrer">Privacy Policy / Politika privatnosti</a></div></main></div><div class="toast" id="toast"></div>
<script>
const KEY='petcare_data_v1';
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const localDateOffset=days=>{const d=new Date();d.setDate(d.getDate()+days);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data=load(), activePet=data.pets[0]?.id||null, tab='home', formMode=null;
function seed(){return {pets:[],health:[],weights:[],logs:[],food:[],costs:[],reminders:[],bonding:[]}}
function load(){try{return {...seed(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return seed()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast('Nema dovoljno prostora za čuvanje. Sačuvajte rezervnu kopiju.');console.error('Save failed:',e);return}window.petCareCloud?.save(data);window.petCareNative?.sync([...data.reminders,...data.health.filter(h=>h.nextDate).map(h=>({...h,title:h.title||h.category||'Health reminder',time:'09:00'}))],data.pets).catch(e=>console.warn('Notification sync:',e))}
function pet(){return data.pets.find(p=>p.id===activePet)}
function money(n){return new Intl.NumberFormat('sr-RS',{style:'currency',currency:'RSD',maximumFractionDigits:0}).format(Number(n)||0)}
function date(s){if(!s)return '—';return new Date(s+'T12:00:00').toLocaleDateString('sr-RS')}
function age(d){if(!d)return '';let n=Math.floor((Date.now()-new Date(d).getTime())/31557600000);return n<1?'manje od godinu dana':`${n} ${n===1?'godina':'godina'}`}
function toast(s){let el=document.getElementById('toast');el.textContent=s;el.style.display='block';setTimeout(()=>el.style.display='none',2600)}
function petName(id){return data.pets.find(p=>p.id===id)?.name||'Nepoznat ljubimac'}
const PET_EMOJI={"Pas":"🐕","Mačka":"🐈","Papagaj":"🦜","Kanarinac":"🐦","Ptica":"🐦","Zec":"🐇","Hrčak":"🐹","Morsko prase":"🐹","Činčila":"🐭","Miš":"🐭","Pacov":"🐀","Gerbil":"🐭","Tvor":"🦦","Jež":"🦔","Glodar":"🐹","Riba":"🐠","Kornjača":"🐢","Zmija":"🐍","Gušter":"🦎","Gekon":"🦎","Iguana":"🦎","Kameleon":"🦎","Reptil":"🦎","Žaba":"🐸","Aksolotl":"🦎","Vodozemac":"🐸","Pauk":"🕷️","Tarantula":"🕷️","Škorpija":"🦂","Puž":"🐌","Rak":"🦀","Insekt":"🦗","Konj":"🐎","Poni":"🐴","Magarac":"🫏","Koza":"🐐","Ovca":"🐑","Svinja":"🐖","Kokoška":"🐔","Patka":"🦆","Guska":"🪿","Golub":"🕊️","Ostalo":"🐾"};
function petEmoji(type){return PET_EMOJI[type]||'🐾'}
function renderChips(){let el=document.getElementById('petChips');el.innerHTML=data.pets.map(p=>`<button class="petchip ${p.id===activePet?'active':''}" data-pet="${p.id}">${p.photo?`<img src="${p.photo}" style="width:20px;height:20px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:5px">`:petEmoji(p.type)} ${esc(p.name)}</button>`).join('')+`<button class="petchip" data-action="addpet">＋ Dodaj ljubimca</button>`;el.querySelectorAll('[data-pet]').forEach(b=>b.onclick=()=>{activePet=b.dataset.pet;render()});el.querySelector('[data-action="addpet"]').onclick=()=>{tab='pets';formMode='pet';render()}}
function header(title,btn=''){return `<div class="sectionhead"><h2>${title}</h2>${btn}</div>`}
function card(title,body){return `<section class="card"><h3>${title}</h3>${body}</section>`}
function list(items,fn,empty='Još nema unosa.'){return items.length?items.map(fn).join(''):`<div class="empty">${empty}</div>`}
function petFilter(arr){return arr.filter(x=>x.petId===activePet)}
function render(){renderChips();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let el=document.getElementById('content');if(!data.pets.length&&!['pets','shop','deals','vets','assistant'].includes(tab)){el.innerHTML=`<div class="notice">Dobro došli! Dodajte ljubimca da biste pratili zdravlje, obroke, obaveze i troškove.</div><button class="btn" onclick="tab='pets';formMode='pet';render()">＋ Dodaj prvog ljubimca</button>`;return}el.innerHTML=({home:homeView,pets:petsView,health:healthView,diary:diaryView,food:foodView,costs:costsView,reminders:remindersView,bonding:bondingView,shop:shopView,deals:dealsView,vets:vetsView,assistant:assistantView}[tab]||homeView)();wireForms()}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;formMode=null;render()}});
function homeView(){let p=pet(), hs=petFilter(data.health), due=[...hs,...petFilter(data.reminders)].filter(x=>x.nextDate&&x.nextDate<=localDateOffset(30)).sort((a,b)=>a.nextDate.localeCompare(b.nextDate));let costs=petFilter(data.costs).filter(x=>x.date?.slice(0,4)===String(new Date().getFullYear())).reduce((s,x)=>s+(+x.amount||0),0);let w=petFilter(data.weights).sort((a,b)=>b.date.localeCompare(a.date))[0];return `${p?`<div class="card" style="margin-bottom:14px"><div class="row"><div class="avatar">${p.photo?`<img src="${p.photo}">`:(p.type==='Pas'?'🐕':p.type==='Mačka'?'🐈':p.type==='Ptica'?'🦜':'🐾')}</div><div class="grow"><div style="font-size:21px;font-weight:850"><span data-user-content>${esc(p.name)}</span></div><div class="muted">${p.breed?`<span data-user-content dir="auto">${esc(p.breed)}</span>`:`<span>${esc(p.type||'Ljubimac')}</span>`}${p.birth?' · '+age(p.birth):''}</div><div class="pill" style="margin-top:6px">${esc(p.type||'Ljubimac')}</div></div><button class="btn secondary" onclick="tab='pets';render()">Profil</button></div></div>`:''}<div class="stats"><div class="stat"><strong>${w?esc(w.kg)+' kg':'—'}</strong><span>Poslednja težina</span></div><div class="stat"><strong>${due.length}</strong><span>Obaveze uskoro</span></div><div class="stat"><strong>${money(costs)}</strong><span>Troškovi ove godine</span></div></div><div class="grid"><section class="card"><h3>📅 Uskoro na redu</h3>${list(due.slice(0,5),x=>`<div class="item"><div class="itemtitle"><span data-user-content>${esc(x.title||x.name||x.kind||'Podsetnik')}</span></div><div class="muted small">${date(x.nextDate)} · ${esc(x.type||'Podsetnik')}</div></div>`,'Nema obaveza u narednih 30 dana.')}</section><section class="card"><h3>⚡ Brzi unos</h3><div class="btnrow"><button class="btn secondary" onclick="tab='diary';formMode='log';render()">＋ Dnevna beleška</button><button class="btn secondary" onclick="tab='health';formMode='health';render()">＋ Zdravstveni unos</button><button class="btn secondary" onclick="tab='costs';formMode='cost';render()">＋ Trošak</button><button class="btn secondary" onclick="tab='diary';formMode='weight';render()">＋ Težina</button></div></section></div>${card('Nedavne beleške',list(petFilter(data.logs).slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3),x=>`<div class="item"><div class="itemtitle">${date(x.date)} · ${esc(x.mood||'Dnevnik')}</div><div><span data-user-content>${esc(x.note||'Bez dodatnih napomena')}</span></div><div class="muted small">Apetit: ${esc(x.appetite||'—')} · Stolica: ${esc(x.stool||'—')}</div></div>`,'Nema beležaka za ovog ljubimca.'))}`}
function petsView(){let p=pet();return `${header('Moji ljubimci',`<button class="btn" onclick="formMode='pet';render()">＋ Dodaj ljubimca</button>`)}${(formMode==='pet'||formMode?.startsWith('editpet:'))?petForm():''}<div class="grid">${list(data.pets,p=>`<section class="card"><div class="row"><div class="avatar">${p.photo?`<img src="${p.photo}">`:p.type==='Pas'?'🐕':p.type==='Mačka'?'🐈':p.type==='Ptica'?'🦜':'🐾'}</div><div class="grow"><div class="itemtitle"><span data-user-content>${esc(p.name)}</span></div><div class="muted"><span>${esc(p.type)}</span> · ${p.breed?`<span data-user-content dir="auto">${esc(p.breed)}</span>`:`<span>Rasa nije uneta</span>`}</div><div class="small muted">${p.birth?'Rođen/a: '+date(p.birth):''}</div></div></div><div class="btnrow"><button class="btn secondary" onclick="activePet='${p.id}';tab='home';render()">Otvori profil</button><button class="btn ghost" onclick="editPet('${p.id}')">Izmeni</button><button class="btn danger" onclick="deletePet('${p.id}')">Obriši</button></div></section>`,'Dodajte svog prvog ljubimca.')}</div>`}
function petForm(){let p=formMode?.startsWith('editpet:')?data.pets.find(x=>x.id===formMode.split(':')[1]):null;return `<section class="card" style="margin-bottom:14px"><h3>${p?'Izmena profila':'Novi profil ljubimca'}</h3><form id="petForm"><input type="hidden" name="id" value="${p?.id||''}"><div class="fields"><div><label>Ime *</label><input name="name" required value="${esc(p?.name||'')}" placeholder="Npr. Luna"></div><div><label>Vrsta *</label><select name="type"><option value="Pas" ${p?.type==='Pas'?'selected':''}>Pas</option><option value="Mačka" ${p?.type==='Mačka'?'selected':''}>Mačka</option><option value="Papagaj" ${p?.type==='Papagaj'?'selected':''}>Papagaj</option><option value="Kanarinac" ${p?.type==='Kanarinac'?'selected':''}>Kanarinac</option><option value="Ptica" ${p?.type==='Ptica'?'selected':''}>Ptica</option><option value="Zec" ${p?.type==='Zec'?'selected':''}>Zec</option><option value="Hrčak" ${p?.type==='Hrčak'?'selected':''}>Hrčak</option><option value="Morsko prase" ${p?.type==='Morsko prase'?'selected':''}>Morsko prase</option><option value="Činčila" ${p?.type==='Činčila'?'selected':''}>Činčila</option><option value="Miš" ${p?.type==='Miš'?'selected':''}>Miš</option><option value="Pacov" ${p?.type==='Pacov'?'selected':''}>Pacov</option><option value="Gerbil" ${p?.type==='Gerbil'?'selected':''}>Gerbil</option><option value="Tvor" ${p?.type==='Tvor'?'selected':''}>Tvor</option><option value="Jež" ${p?.type==='Jež'?'selected':''}>Jež</option><option value="Glodar" ${p?.type==='Glodar'?'selected':''}>Glodar</option><option value="Riba" ${p?.type==='Riba'?'selected':''}>Riba</option><option value="Kornjača" ${p?.type==='Kornjača'?'selected':''}>Kornjača</option><option value="Zmija" ${p?.type==='Zmija'?'selected':''}>Zmija</option><option value="Gušter" ${p?.type==='Gušter'?'selected':''}>Gušter</option><option value="Gekon" ${p?.type==='Gekon'?'selected':''}>Gekon</option><option value="Iguana" ${p?.type==='Iguana'?'selected':''}>Iguana</option><option value="Kameleon" ${p?.type==='Kameleon'?'selected':''}>Kameleon</option><option value="Reptil" ${p?.type==='Reptil'?'selected':''}>Reptil</option><option value="Žaba" ${p?.type==='Žaba'?'selected':''}>Žaba</option><option value="Aksolotl" ${p?.type==='Aksolotl'?'selected':''}>Aksolotl</option><option value="Vodozemac" ${p?.type==='Vodozemac'?'selected':''}>Vodozemac</option><option value="Pauk" ${p?.type==='Pauk'?'selected':''}>Pauk</option><option value="Tarantula" ${p?.type==='Tarantula'?'selected':''}>Tarantula</option><option value="Škorpija" ${p?.type==='Škorpija'?'selected':''}>Škorpija</option><option value="Puž" ${p?.type==='Puž'?'selected':''}>Puž</option><option value="Rak" ${p?.type==='Rak'?'selected':''}>Rak</option><option value="Insekt" ${p?.type==='Insekt'?'selected':''}>Insekt</option><option value="Konj" ${p?.type==='Konj'?'selected':''}>Konj</option><option value="Poni" ${p?.type==='Poni'?'selected':''}>Poni</option><option value="Magarac" ${p?.type==='Magarac'?'selected':''}>Magarac</option><option value="Koza" ${p?.type==='Koza'?'selected':''}>Koza</option><option value="Ovca" ${p?.type==='Ovca'?'selected':''}>Ovca</option><option value="Svinja" ${p?.type==='Svinja'?'selected':''}>Svinja</option><option value="Kokoška" ${p?.type==='Kokoška'?'selected':''}>Kokoška</option><option value="Patka" ${p?.type==='Patka'?'selected':''}>Patka</option><option value="Guska" ${p?.type==='Guska'?'selected':''}>Guska</option><option value="Golub" ${p?.type==='Golub'?'selected':''}>Golub</option><option value="Ostalo" ${p?.type==='Ostalo'?'selected':''}>Ostalo</option></select></div><div><label>Rasa</label><input name="breed" value="${esc(p?.breed||'')}"></div><div><label>Pol</label><select name="sex"><option value="">Nije navedeno</option><option ${p?.sex==='Mužjak'?'selected':''}>Mužjak</option><option ${p?.sex==='Ženka'?'selected':''}>Ženka</option></select></div><div><label>Datum rođenja</label><input type="date" name="birth" value="${p?.birth||''}"></div><div><label>Broj čipa</label><input name="chip" value="${esc(p?.chip||'')}"></div><div><label>Broj pasoša</label><input name="passport" value="${esc(p?.passport||'')}"></div><div><label>Trenutna težina (kg)</label><input type="number" step=".01" min="0" name="kg" value="${p?.kg||''}"></div><div class="field full"><label>Profilna slika</label><input type="file" name="photo" accept="image/*"><div class="small muted">Slika se čuva lokalno; preporučena je manja fotografija.</div></div></div><div class="formactions"><button type="button" class="btn ghost" onclick="formMode=null;render()">Otkaži</button><button class="btn">Sačuvaj profil</button></div></form></section>`}
function editPet(id){formMode='editpet:'+id;tab='pets';render()}

function weightSvg(ws){let arr=ws.slice(-12),vals=arr.map(x=>+x.kg),min=Math.min(...vals),max=Math.max(...vals);if(min===max){min-=1;max+=1}let pts=arr.map((x,i)=>`${25+i*450/Math.max(1,arr.length-1)},${140-(x.kg-min)/(max-min)*110}`).join(' ');return `<line x1="20" y1="140" x2="480" y2="140" stroke="#dce8e2"/><polyline points="${pts}" fill="none" stroke="#238469" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${arr.map((x,i)=>{let px=25+i*450/Math.max(1,arr.length-1),py=140-(x.kg-min)/(max-min)*110;return `<circle cx="${px}" cy="${py}" r="4" fill="#176b57"/><text x="${px}" y="160" text-anchor="middle" font-size="10" fill="#698078">${esc(x.date.slice(5))}</text>`}).join('')}<text x="4" y="16" font-size="11" fill="#698078">${max.toFixed(1)} kg</text><text x="4" y="135" font-size="11" fill="#698078">${min.toFixed(1)}</text>`}

function wireForms(){bind('petForm',async f=>{let o=Object.fromEntries(new FormData(f));let old=o.id?data.pets.find(p=>p.id===o.id):null;let photo=old?.photo||'';let file=f.elements.photo.files[0];if(file){photo=await new Promise(res=>{let r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(file)})}let p={...old,...o,id:o.id||uid(),photo,kg:o.kg||old?.kg||''};if(!data.pets.some(x=>x.id===p.id))data.pets.push(p);else data.pets=data.pets.map(x=>x.id===p.id?p:x);activePet=p.id;if(p.kg&&(!old||Number(old.kg)!==Number(p.kg))){data.weights.push({id:uid(),petId:p.id,date:today(),kg:p.kg})}formMode=null;save();render();toast('Profil je sačuvan.')});

 bind('reminderForm',async f=>{const values=Object.fromEntries(new FormData(f));const at=new Date(values.nextDate+'T'+(values.time||'09:00')+':00');if(!Number.isFinite(at.getTime())||at.getTime()<=Date.now()){toast(currentLang()==='sr'?'Izaberite budući datum i vreme.':'Choose a future date and time.');return;}data.reminders.push({...values,id:uid(),petId:activePet});formMode=null;save();render();try{const result=await window.petCareNative.sync([...data.reminders,...data.health.filter(h=>h.nextDate).map(h=>({...h,title:h.title||h.category||'Health reminder',time:'09:00'}))],data.pets);toast(currentLang()==='sr'?(result.native&&result.permission&&result.count>0?'Sačuvano i zakazano na telefonu.':'Sačuvano. Obaveštenje na telefonu nije zakazano; otvorite Pomoć i provere.'):(result.native&&result.permission&&result.count>0?'Saved and scheduled on your phone.':'Saved. Phone notification not scheduled; open Help and device checks.'));}catch{toast(currentLang()==='sr'?'Sačuvano, ali zakazivanje nije uspelo. Otvorite Pomoć i provere.':'Saved, but scheduling failed. Open Help and device checks.');}})}

function bondingView(){const p=pet(),items=petFilter(data.bonding||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));const mins=items.filter(x=>x.date?.slice(0,7)===today().slice(0,7)).reduce((n,x)=>n+(Number(x.minutes)||0),0);const tips=bondingTips[p?.type]||bondingTips.Ostalo;const fed=items.find(x=>x.activity==='Hranjenje'&&x.date===today());const walked=items.find(x=>x.activity==='Šetnja'&&x.date===today());return `${header('🐾 Druženje i saveti',`<button class="btn" onclick="formMode='bonding';render()">＋ Dodaj aktivnost</button>`)}<div class="notice">Ovde član porodice može da označi da je ljubimac nahranjen, izveden u šetnju ili treniran, uz ime osobe, vreme i pređene kilometre. Podaci se čuvaju na ovom uređaju; deljenje između telefona još nije dostupno. Saveti nisu zamena za veterinara.</div><div class="grid" style="margin-bottom:12px"><div class="card"><h3>🥣 Hranjenje danas</h3><strong>${fed?'✅ Nahranjen/a':'⏳ Nije evidentirano'}</strong><div class="muted small">${fed?esc(fed.caregiver||'Član porodice')+(fed.time?' · '+esc(fed.time):''):'Dodajte aktivnost „Hranjenje“ kada neko nahrani ljubimca.'}</div></div><div class="card"><h3>🐕 Šetnja danas</h3><strong>${walked?'✅ Obavljena':'⏳ Nije evidentirana'}</strong><div class="muted small">${walked?(walked.distanceKm?esc(walked.distanceKm)+' km · ':'')+esc(walked.caregiver||'Član porodice'):'Unesite pređenu udaljenost u kilometrima.'}</div></div></div><div class="stats"><div class="stat"><strong>${mins}</strong><span>Minuta ovog meseca</span></div><div class="stat"><strong>${items.length}</strong><span>Zabeleženih aktivnosti</span></div><div class="stat"><strong>${p?esc(p.name):'—'}</strong><span>Moj ljubimac</span></div></div>${formMode==='bonding'?`<section class="card" style="margin-bottom:14px"><h3>Nova zajednička aktivnost</h3><form id="bondingForm"><div class="fields"><div><label>Datum</label><input type="date" name="date" required value="${today()}"></div><div><label>Aktivnost</label><select name="activity"><option>Hranjenje</option><option>Šetnja</option><option>Igra</option><option>Trening</option><option>Maženje</option><option>Istraživanje</option><option>Drugo</option></select></div><div><label>Trajanje (minuta, ako je primenljivo)</label><input type="number" name="minutes" min="0" max="1440" value="0"></div><div><label>Pređena udaljenost (km, za šetnju)</label><input type="number" name="distanceKm" min="0" max="200" step="0.01" placeholder="Npr. 2.5"></div><div><label>Ko je obavio aktivnost?</label><input name="caregiver" maxlength="80" placeholder="Npr. mama, tata, Jale"></div><div><label>Vreme</label><input type="time" name="time"></div><div class="field full"><label>Napomene</label><textarea name="notes"></textarea></div></div><div class="formactions"><button class="btn">Sačuvaj</button></div></form></section>`:''}<div class="grid"><section class="card"><h3>💡 Saveti za <span data-user-content>${esc(p?.name||'ljubimca')}</span></h3>${tips.map(t=>`<div class="item">${esc(t)}</div>`).join('')}</section><section class="card"><h3>⏱️ Zajedničko vreme</h3>${list(items,x=>`<div class="item"><div class="row"><div class="grow"><div class="itemtitle">${esc(x.activity)}${Number(x.minutes)>0?' · '+esc(x.minutes)+' min':''}${Number(x.distanceKm)>0?' · '+esc(x.distanceKm)+' km':''}</div><div class="muted small">${date(x.date)}${x.time?' u '+esc(x.time):''}${x.caregiver?' · Obavio/la: '+esc(x.caregiver):''}</div>${x.notes?`<div><span data-user-content>${esc(x.notes)}</span></div>`:''}</div><button class="btn ghost" onclick="del('bonding','${x.id}')">×</button></div></div>`,'Još nema aktivnosti.')}</section></div><div class="btnrow"><button class="btn secondary" onclick="tab='reminders';formMode='reminder';render()">🔔 Zakaži druženje</button></div>`}

function discoveryLinks(){return `<section class="card" style="margin-top:12px"><h3>🔗 Brzi pristup / Quick links</h3><p class="muted small">Rezultati se otvaraju kod spoljnih pružalaca usluga. Proverite dostupnost, radno vreme i cenu pre odlaska ili kupovine.</p><div class="btnrow"><button class="btn secondary" onclick="openMaps('veterinary clinic near me')">📍 Veterinari na mapi</button><button class="btn secondary" onclick="openMaps('24 hour emergency vet near me')">🚑 Hitni veterinar</button><button class="btn secondary" onclick="openShopping('pet food')">🥣 Hrana online</button><button class="btn secondary" onclick="externalSearch('pet food deals discount')">🏷️ Akcije</button></div></section>`}
// Public JSON catalog feed (optional): [{id,title,category,country,price,currency,url,expiresAt,discountPercent}].
// No merchant data is invented; feeds must permit cross-origin fetch and HTTPS.
const CATALOG_URL_KEY='petcare_catalog_feed_url';
let catalogState={items:[],checked:0,error:''};
function safeCatalogUrl(url){try{const u=new URL(url);return u.protocol==='https:'?u.href:''}catch{return ''}}
async function refreshCatalog(){const url=safeCatalogUrl(localStorage.getItem(CATALOG_URL_KEY)||'');if(!url){catalogState={items:[],checked:Date.now(),error:'Nije povezan katalog dobavljača.'};render();return}try{const resp=await fetch(url,{cache:'no-store'});if(!resp.ok)throw Error('HTTP '+resp.status);const body=await resp.json();const arr=Array.isArray(body)?body:body.items;if(!Array.isArray(arr))throw Error('Pogrešan format kataloga');const items=arr.slice(0,250).filter(x=>x&&typeof x.title==='string'&&safeCatalogUrl(x.url||'')&&(!x.expiresAt||Date.parse(x.expiresAt)>Date.now())).map(x=>({title:String(x.title).slice(0,160),category:String(x.category||'').slice(0,70),country:String(x.country||'').slice(0,60),price:x.price,currency:String(x.currency||'').slice(0,8),url:safeCatalogUrl(x.url),discountPercent:Number(x.discountPercent)||0}));catalogState={items,checked:Date.now(),error:''};render()}catch(e){catalogState={...catalogState,checked:Date.now(),error:'Katalog nije dostupan: '+String(e.message).slice(0,120)};render()}}
function catalogCards(onlyDeals=false){const items=catalogState.items.filter(x=>!onlyDeals||x.discountPercent>0);return `<section class="card" style="margin-top:14px"><h3>🔄 ${onlyDeals?'Aktuelne ponude iz povezanog kataloga':'Katalog povezanih prodavaca'}</h3><p class="muted small">${catalogState.error?esc(catalogState.error):catalogState.checked?'Poslednja provera: '+new Date(catalogState.checked).toLocaleString():'Katalog još nije proveren.'} Podaci potiču od povezanog dobavljača; proverite cenu i dostupnost.</p>${items.length?items.map(x=>`<div class="item"><div class="itemtitle"><span data-user-content>${esc(x.title)}</span></div><div class="small muted">${esc(x.category)} ${x.country?'· '+esc(x.country):''} ${Number.isFinite(Number(x.price))&&x.price!==undefined?'· '+esc(x.price)+' '+esc(x.currency):''} ${x.discountPercent>0?'· -'+esc(x.discountPercent)+'%':''}</div><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">Otvori ponudu ↗</a></div>`).join(''):'<div class="empty">Nema potvrđenih ponuda iz povezanog kataloga. Koristite pretragu ispod.</div>'}<div class="btnrow"><button class="btn secondary" onclick="refreshCatalog()">Osveži katalog</button><button class="btn ghost" onclick="configureCatalog()">Poveži dobavljača</button></div></section>`}
function configureCatalog(){const old=localStorage.getItem(CATALOG_URL_KEY)||'';const value=prompt('HTTPS adresa javnog JSON kataloga dobavljača (ostavite prazno za isključivanje):',old);if(value===null)return;if(value.trim()&&!safeCatalogUrl(value.trim())){toast('Unesite ispravnu HTTPS adresu.');return}localStorage.setItem(CATALOG_URL_KEY,value.trim());refreshCatalog()}
window.addEventListener('load',()=>{if(localStorage.getItem(CATALOG_URL_KEY))refreshCatalog();setInterval(()=>{if(localStorage.getItem(CATALOG_URL_KEY)&&Date.now()-catalogState.checked>6*3600e3)refreshCatalog()},3600e3)});
function shopView(){return `${header('🛍️ Prodavnica hrane i opreme')}<div class="notice">Pronađite prodavnice za pse, mačke, ptice i druge ljubimce. Kupovina se obavlja na sajtu prodavca; Pet Care još nema sopstvenu naplatu niti katalog proizvoda uživo.</div><section class="card"><h3>Pronađi hranu i opremu</h3><form id="shopSearch"><div class="fields"><div><label>Država</label><input name="country" required placeholder="Srbija / Germany / USA"></div><div><label>Vrsta ljubimca</label><select name="species"><option>Pas</option><option>Mačka</option><option>Ptica</option><option>Glodar</option><option>Ostalo</option></select></div><div class="field full"><label>Šta tražite?</label><input name="product" placeholder="Hrana, igračke, oprema, poslastice"></div></div><div class="formactions"><button class="btn">Pretraži prodavnice</button></div></form></section>${catalogCards(false)}${discoveryLinks()}`}
function dealsView(){return `${header('🏷️ Akcije i popusti')}<div class="notice">Akcije nisu automatski potvrđene niti ažurirane u aplikaciji. Pretraga otvara rezultate na internetu; cenu i trajanje ponude proverite kod prodavca.</div><section class="card"><h3>Pronađi aktuelne ponude</h3><form id="dealsSearch"><div class="fields"><div><label>Država</label><input name="country" required placeholder="Srbija / Germany / USA"></div><div><label>Kategorija</label><select name="category"><option>Hrana za pse</option><option>Hrana za mačke</option><option>Hrana za ptice</option><option>Hrana za glodare</option><option>Oprema za ljubimce</option><option>Veterinarske usluge</option></select></div></div><div class="formactions"><button class="btn">Pretraži akcije</button></div></form></section>${catalogCards(true)}${discoveryLinks()}`}
function vetsView(){return `${header('🩺 Veterinari širom sveta')}<div class="notice">Ne postoji univerzalan i pouzdan broj veterinarske hitne pomoći za sve države. Pronađite lokalne ordinacije i dežurne službe prema državi i gradu. Kontakti iz pretrage nisu provereni od strane Pet Care aplikacije. U hitnom slučaju pozovite lokalnog veterinara direktno.</div><section class="card"><h3>Pronađi veterinara</h3><form id="vetsSearch"><div class="fields"><div><label>Država</label><input name="country" required placeholder="Srbija / Germany / USA"></div><div><label>Grad</label><input name="city" required placeholder="Beograd / Berlin / London"></div><div><label>Usluga</label><select name="service"><option>Dežurni veterinar 24h</option><option>Veterinarska ambulanta</option><option>Veterinarska bolnica</option><option>Hitna veterinarska pomoć</option></select></div></div><div class="formactions"><button class="btn">Pronađi kontakte</button></div></form></section>${discoveryLinks()}`}
function assistantView(){return `${header('🤖 Pet Care AI asistent')}<div class="notice">Pravi AI razgovor unutar aplikacije zahteva bezbedan serverski API i podešavanje modela. Ova verzija ne glumi AI niti šalje vaše privatne podatke. Možete otvoriti ChatGPT zasebno ili koristiti pretragu za opšte informacije.</div><section class="card"><h3>Pomoć oko ljubimaca</h3><p class="muted">Za savete o ishrani, ponašanju i svakodnevnoj nezi možete otvoriti AI servis. Ne unosite broj čipa, pasoša ili lične podatke u spoljne servise. Za hitne simptome kontaktirajte veterinara.</p><div class="btnrow"><a class="btn" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer" style="text-decoration:none">Otvori ChatGPT</a><a class="btn secondary" href="https://gemini.google.com/" target="_blank" rel="noopener noreferrer" style="text-decoration:none">Otvori Gemini</a></div></section>`}

const supportedLanguages = ["en", "sr", "de", "fr", "es", "it", "pt", "tr", "ru", "zh", "ja", "ar", "hi", "nl", "pl", "el", "ro", "hr", "bg", "ko", "id", "th", "vi", "sv"];
function currentLang(){
  const stored=localStorage.getItem(LANG_KEY);
  if(stored && supportedLanguages.includes(stored)) return stored;
  return 'en'; // English is the default until the user selects a flag.
}
function translateText(s){
  const lang=currentLang();
  if(lang==='sr') return s;
  if(extraTranslations[lang]?.[s]) return extraTranslations[lang][s];
  return translations[s]||s;
}
function translateUI(){

  document.documentElement.lang=lang;

  const tag=document.getElementById('tagline');if(tag)tag.textContent=lang==='sr'?'Brinemo o svojim ljubimcima':'Caring for the pets we love';

  document.querySelectorAll('#nav button').forEach(b=>{if(!b.dataset.original)b.dataset.original=b.textContent.trim();b.textContent=translateText(b.dataset.original)});
  const foot=document.getElementById('footerNote');if(foot){foot.replaceChildren(document.createTextNode(lang==='sr'?'Pet Care World • Evidencija ljubimaca ostaje na uređaju. Chat poruke su javne. ':'Pet Care World • Pet records stay on this device. Chat messages are public. '));const a=document.createElement('a');a.href='privacy.html';a.textContent=lang==='sr'?'Politika privatnosti':'Privacy Policy';foot.append(a);}
  const root=document.getElementById('content');
  if(root){
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
    nodes.forEach(n=>{if(n.__srOriginal===undefined)n.__srOriginal=n.nodeValue;const raw=n.__srOriginal;const trimmed=raw.trim();if(trimmed){const translated=translateText(trimmed);n.nodeValue=raw.replace(trimmed,translated)}});
    root.querySelectorAll('input[placeholder],textarea[placeholder]').forEach(el=>{if(!el.dataset.srPlaceholder)el.dataset.srPlaceholder=el.placeholder;el.placeholder=translateText(el.dataset.srPlaceholder)});
    root.querySelectorAll('option').forEach(el=>{if(!el.dataset.srText)el.dataset.srText=el.textContent;el.textContent=translateText(el.dataset.srText)});
  }
}

<script>
// Uses Capacitor's injected native bridge in Android/iOS builds; does nothing on the web.
window.petCareNative = {
 async enable(){
   const api=window.Capacitor?.Plugins?.LocalNotifications;
   if(!api) return false;
   const p=await api.requestPermissions();return p.display==='granted';
 },
 async sync(reminders,pets){
   const api=window.Capacitor?.Plugins?.LocalNotifications;
   if(!api)return {native:false};
   const p=await api.checkPermissions();if(p.display!=='granted')return {native:true,permission:false};
   const choice=window.petCarePreferences?.notification()||{id:'petcare_cheerful_v1',sound:'petcare_cheerful.wav',vibration:true};
   if(window.Capacitor?.getPlatform?.()==='android')await api.createChannel({id:choice.id,name:'Pet Care reminders · '+(choice.sound||'silent'),description:'Meals and pet-care reminders',importance:4,visibility:0,sound:choice.sound,vibration:choice.vibration});
   const old=await api.getPending();
   const own=(old.notifications||[]).filter(n=>n.extra?.petCare).map(n=>({id:n.id}));
   if(own.length)await api.cancel({notifications:own});
   if(window.petCarePreferences?.get().notifications===false)return {native:true,permission:true,count:0};
   const now=Date.now(), scheduled=[];
   for(const r of reminders){
     if(!r.nextDate&&!r.daily&&!r.at)continue;
     let at=r.at?new Date(r.at):new Date((r.nextDate||today())+'T'+(r.time||'09:00')+':00');
     if(r.daily&&at.getTime()<=now)at.setDate(at.getDate()+1);
     if(!Number.isFinite(at.getTime())||at.getTime()<=now)continue;
     const pet=pets.find(p=>p.id===r.petId);
     const hash=Array.from(String(r.id)).reduce((h,c)=>(Math.imul(h,31)+c.charCodeAt(0))|0,7);
     scheduled.push({id:Math.abs(hash)%2000000000+1,title:'Pet Care · '+(pet?.name||'Ljubimac'),body:r.title||'Podsetnik',channelId:choice.id,sound:choice.sound,schedule:r.daily?{on:{hour:at.getHours(),minute:at.getMinutes()},allowWhileIdle:true}:{at,allowWhileIdle:true},extra:{petCare:true}});
   }
   scheduled.sort((a,b)=>a.schedule.at-b.schedule.at);
   if(scheduled.length)await api.schedule({notifications:scheduled.slice(0,64)});
   return {native:true,permission:true,count:Math.min(scheduled.length,64)};
 }
};
</script>

const communityNav=document.createElement('button');communityNav.dataset.tab='community';communityNav.textContent='💬 Zajednica';document.getElementById('nav').appendChild(communityNav);
function communityView(){const reports=(data.communityReports||[]).slice().sort((a,b)=>b.created.localeCompare(a.created));return `${header('💬 Pet Care zajednica')}<div class="notice"><b>Važno:</b> Oglasi se trenutno čuvaju samo na ovom uređaju. Drugi korisnici ih neće videti dok ne povežemo zajednički server. Prijavu možete odmah podeliti drugim ljudima putem aplikacija na telefonu. Za javni tekstualni razgovor koristite prečicu Chat. Video-pozivi se otvaraju u spoljnim servisima.</div><section class="card"><h3>📸 Objavi prijavu ili akciju</h3><form id="communityForm"><div class="fields"><div><label>Vrsta objave</label><select name="kind"><option>Izgubljen ljubimac</option><option>Pronađen ljubimac</option><option>Udomljavanje</option><option>Akcija pomoći</option><option>Događaj zajednice</option></select></div><div><label>Grad / lokacija (bez kućne adrese)</label><input name="city" required maxlength="100" placeholder="Npr. Pančevo"></div><div class="field full"><label>Naslov *</label><input name="title" required maxlength="120"></div><div class="field full"><label>Opis *</label><textarea name="details" required maxlength="1000" placeholder="Opišite šta se dogodilo, kada i kako drugi mogu pomoći."></textarea></div><div><label>Kontakt za dobrovoljno deljenje (opciono)</label><input name="contact" maxlength="120" placeholder="Telefon ili javni kontakt"></div><div><label>Fotografija (kamera ili galerija)</label><input type="file" name="photo" accept="image/*" capture="environment"></div></div><p class="muted small">Ne objavljujte tuđe privatne podatke ili tačnu kućnu adresu. Fotografije se čuvaju lokalno; velika fotografija može popuniti prostor.</p><div class="formactions"><button class="btn">Sačuvaj prijavu</button></div></form></section><section class="card" style="margin-top:14px"><h3>📣 Moje prijave</h3>${reports.length?reports.map(x=>`<div class="item"><div class="itemtitle">${esc(x.kind)} · ${esc(x.title)}</div><div class="muted small"><span data-user-content>${esc(x.city)}</span> · ${esc(x.created.slice(0,10))}</div>${x.photo?`<img alt="Fotografija prijave" src="${x.photo}" style="max-width:100%;max-height:260px;border-radius:12px;margin:8px 0;object-fit:contain">`:''}<p>${esc(x.details)}</p><div class="btnrow"><button class="btn secondary" onclick="shareCommunity('${x.id}')">📤 Podeli</button><button class="btn ghost" onclick="removeCommunity('${x.id}')">Obriši</button></div></div>`).join(''):'<div class="empty">Još nema prijava.</div>'}</section><section class="card" style="margin-top:14px"><h3>💬 Razgovor i video-pozivi</h3><button class="btn" onclick="document.getElementById('globalChatShortcut').click()">Otvori globalni chat</button><p class="muted">Prečica Chat otvara javnu sobu za punoletne ljubitelje životinja. Pridružite se nadimkom i prihvatite pravila. Video-pozivi su dostupni preko spoljnog servisa.</p><div class="btnrow"><a class="btn secondary" href="https://web.whatsapp.com/" target="_blank" rel="noopener noreferrer">💬 Otvori WhatsApp</a><a class="btn secondary" href="https://meet.google.com/new" target="_blank" rel="noopener noreferrer">📹 Kreiraj video-poziv</a></div></section>`}
async function communityPhoto(file){if(!file)return '';if(!file.type.startsWith('image/'))throw Error('Izaberite fotografiju.');if(file.size>8*1024*1024)throw Error('Fotografija mora biti manja od 8 MB.');return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result));r.onerror=()=>reject(Error('Fotografija nije učitana.'));r.readAsDataURL(file)})}
function communityText(x){return `🐾 Pet Care — ${x.kind}\n${x.title}\n📍 ${x.city}\n${x.details}${x.contact?'\nKontakt: '+x.contact:''}\nDatum: ${x.created.slice(0,10)}`}
async function shareCommunity(id){const x=data.communityReports.find(z=>z.id===id);if(!x)return;const message=communityText(x);try{if(navigator.share){const payload={title:x.title,text:message};if(x.photo&&navigator.canShare){const res=await fetch(x.photo),blob=await res.blob(),file=new File([blob],'pet-care-prijava.jpg',{type:blob.type||'image/jpeg'});if(navigator.canShare({files:[file]}))payload.files=[file]}await navigator.share(payload)}else if(navigator.clipboard){await navigator.clipboard.writeText(message);toast('Tekst prijave kopiran. Podelite ga u željenoj aplikaciji.')}else{prompt('Kopirajte tekst prijave:',message)}}catch(e){if(e.name!=='AbortError')toast('Deljenje nije uspelo. Pokušajte ponovo.')}}
function removeCommunity(id){if(!confirm('Obrisati ovu lokalnu prijavu?'))return;data.communityReports=data.communityReports.filter(x=>x.id!==id);save();render()}
function wireCommunity(){const f=document.getElementById('communityForm');if(f)f.onsubmit=async e=>{e.preventDefault();try{const o=Object.fromEntries(new FormData(f));const photo=await communityPhoto(f.elements.photo.files[0]);data.communityReports.push({id:uid(),created:new Date().toISOString(),kind:o.kind,city:o.city.trim(),title:o.title.trim(),details:o.details.trim(),contact:o.contact.trim(),photo});save();render();toast('Prijava sačuvana na ovom uređaju. Podelite je da je drugi vide.')}catch(err){toast(err.message||'Nije moguće sačuvati prijavu.')}}}
const communityRenderBefore=render;
render=function(){if(tab==='community'){renderChips();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.getElementById('content').innerHTML=communityView();wireCommunity();return}communityRenderBefore()};

// Private photo/video gallery. Media blobs are stored in IndexedDB, separate from legacy petcare_data_v1.
const galleryNav=document.createElement('button');galleryNav.dataset.tab='gallery';galleryNav.textContent='📸 Moja galerija';document.getElementById('nav').appendChild(galleryNav);
const GALLERY_DB='petcare_gallery_v1';let galleryUrls=[];
function galleryDb(){return new Promise((resolve,reject)=>{if(!window.indexedDB){reject(Error('Ovaj pregledač ne podržava lokalnu galeriju.'));return}const req=indexedDB.open(GALLERY_DB,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('media'))db.createObjectStore('media',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function galleryTx(mode,callback){const db=await galleryDb();return new Promise((resolve,reject)=>{const tx=db.transaction('media',mode),store=tx.objectStore('media');let result;try{result=callback(store)}catch(e){db.close();reject(e);return}tx.oncomplete=()=>{db.close();resolve(result)};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function galleryAll(){const db=await galleryDb();return new Promise((resolve,reject)=>{const tx=db.transaction('media','readonly'),req=tx.objectStore('media').getAll();req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error);tx.oncomplete=()=>db.close()})}
async function galleryPut(record){await galleryTx('readwrite',s=>s.put(record))}
async function galleryRemove(id){await galleryTx('readwrite',s=>s.delete(id))}
let galleryRecords=[];
function galleryView(){return `${header('📸 Moja galerija')}<div class="notice">Fotografije i video-snimci su privatni i čuvaju se samo na ovom uređaju. Ne šalju se na internet. <b>Važno:</b> standardni JSON backup ne sadrži slike i video iz ove galerije. Sačuvajte originalne snimke i u galeriji telefona. Brisanje podataka aplikacije može obrisati i ovu galeriju.</div><section class="card"><h3>➕ Dodaj uspomenu</h3><form id="galleryForm"><div class="fields"><div><label>Ljubimac</label><select name="petId" required>${data.pets.map(p=>`<option value="${esc(p.id)}" ${p.id===activePet?'selected':''}><span data-user-content>${esc(p.name)}</span></option>`).join('')}</select></div><div><label>Datum</label><input type="date" name="date" value="${today()}" required></div><div class="field full"><label>Fotografija ili video</label><input type="file" name="media" accept="image/*,video/*" required></div><div class="field full"><label>Opis uspomene</label><input name="caption" maxlength="160" placeholder="Npr. Prva šetnja, rođendan..."></div></div><p class="small muted">Najviše 30 MB po snimku. Za veće video-snimke koristite galeriju telefona.</p><div class="formactions"><button class="btn">💾 Sačuvaj uspomenu</button></div></form></section><section class="card" style="margin-top:14px"><h3>❤️ Moje uspomene</h3><div id="galleryItems"><div class="empty">Učitavanje galerije...</div></div></section>`}
async function galleryLoad(){const el=document.getElementById('galleryItems');if(!el)return;galleryUrls.forEach(u=>URL.revokeObjectURL(u));galleryUrls=[];try{galleryRecords=(await galleryAll()).sort((a,b)=>(b.date||'').localeCompare(a.date||''));const rows=galleryRecords.filter(x=>data.pets.some(p=>p.id===x.petId));el.innerHTML=rows.length?rows.map(x=>{const url=URL.createObjectURL(x.blob);galleryUrls.push(url);return `<div class="item"><div class="itemtitle"><span data-user-content>${esc(petName(x.petId))}</span> · ${esc(x.caption||'Uspomena')}</div><div class="muted small">${date(x.date)} ${x.favorite?'· ❤️ Omiljeno':''}</div>${x.type.startsWith('video/')?`<video controls preload="metadata" playsinline src="${url}" style="width:100%;max-height:320px;border-radius:12px;margin-top:8px"></video>`:`<img alt="Uspomena sa ljubimcem" loading="lazy" src="${url}" style="max-width:100%;max-height:320px;object-fit:contain;border-radius:12px;margin-top:8px">`}<div class="btnrow"><button class="btn secondary" data-gallery="favorite" data-id="${x.id}">${x.favorite?'🤍 Ukloni iz omiljenih':'❤️ Omiljeno'}</button><button class="btn secondary" data-gallery="share" data-id="${x.id}">📤 Podeli</button><button class="btn danger" data-gallery="delete" data-id="${x.id}">Obriši</button></div></div>`}).join(''):'<div class="empty">Još nema uspomena. Dodajte prvu fotografiju ili video.</div>'}catch(e){el.textContent='Galerija nije dostupna: '+e.message}}
async function galleryAction(action,id){const x=galleryRecords.find(r=>r.id===id);if(!x)return;try{if(action==='favorite'){x.favorite=!x.favorite;await galleryPut(x);await galleryLoad()}if(action==='delete'){if(!confirm('Obrisati ovu uspomenu iz Pet Care galerije?'))return;await galleryRemove(id);await galleryLoad()}if(action==='share'){const file=new File([x.blob],x.name||'pet-care-uspomena',{type:x.type});if(navigator.share&&navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:x.caption||'Pet Care uspomena'})}else{const url=URL.createObjectURL(x.blob),a=document.createElement('a');a.href=url;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Snimak preuzet. Možete ga podeliti iz galerije telefona.')}}}catch(e){if(e.name!=='AbortError')toast('Greška: '+e.message)}}
function galleryWire(){const f=document.getElementById('galleryForm');if(f)f.onsubmit=async e=>{e.preventDefault();const file=f.elements.media.files[0];if(!file)return;if(!(/^(image|video)\//.test(file.type))){toast('Izaberite fotografiju ili video.');return}if(file.size>30*1024*1024){toast('Snimak je veći od 30 MB.');return}const btn=f.querySelector('button[type=submit],button.btn');btn.disabled=true;try{await galleryPut({id:uid()+uid(),petId:f.elements.petId.value,date:f.elements.date.value,caption:f.elements.caption.value.trim(),name:file.name,type:file.type,blob:file,favorite:false});f.reset();toast('Uspomena je sačuvana na uređaju.');await galleryLoad()}catch(err){toast('Nije moguće sačuvati snimak: '+err.message)}finally{btn.disabled=false}};document.getElementById('galleryItems')?.addEventListener('click',e=>{const b=e.target.closest('[data-gallery]');if(b)galleryAction(b.dataset.gallery,b.dataset.id)});galleryLoad()}
const galleryRenderBefore=render;
render=function(){if(tab==='gallery'){renderChips();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.getElementById('content').innerHTML=data.pets.length?galleryView():`<div class="notice">Prvo dodajte ljubimca da biste napravili njegov album.</div><button class="btn" onclick="tab='pets';formMode='pet';render()">＋ Dodaj ljubimca</button>`;if(data.pets.length)galleryWire();return}galleryRenderBefore()};


// Pet Care World: local publication drafts, never represented as an online public feed.
const WORLD_KEY='petcare_world_drafts_v1';
let worldMediaUrls=[];
function worldDrafts(){try{const v=JSON.parse(localStorage.getItem(WORLD_KEY)||'[]');return Array.isArray(v)?v:[]}catch{return []}}
function worldSave(items){localStorage.setItem(WORLD_KEY,JSON.stringify(items))}
function worldView(){return `${header('🌍 Pet Care World')}<div class="notice"><b>Pet Care World – zajednica u pripremi.</b> Ovde možete sastaviti objavu sa fotografijom ili videom, sačuvati je privatno i podeliti preko drugih aplikacija. Objave se još ne prikazuju drugim Pet Care korisnicima: za javni feed, komentare i lajkove potreban je server i moderacija.</div><section class="card"><h3>📸 Podeli trenutak sa ljubimcem</h3><form id="worldForm"><div class="fields"><div><label>Ljubimac</label><select name="petId">${data.pets.map(p=>`<option value="${esc(p.id)}"><span data-user-content>${esc(p.name)}</span></option>`).join('')}</select></div><div><label>Vrsta objave</label><select name="category"><option>Šetnja</option><option>Ishrana</option><option>Igra</option><option>Trening</option><option>Putovanje</option><option>Savet</option><option>Akcija pomoći</option><option>Izgubljen ljubimac</option><option>Ostalo</option></select></div><div><label>Država (opciono)</label><input name="country" maxlength="60" placeholder="Npr. Srbija"></div><div><label>Grad (opciono)</label><input name="city" maxlength="60" placeholder="Npr. Beograd"></div><div class="field full"><label>Šta želite da podelite?</label><textarea name="message" required maxlength="1000" placeholder="Danas smo šetali parkom... "></textarea></div><div class="field full"><label>Fotografija ili video (opciono)</label><input type="file" name="media" accept="image/*,video/*"></div></div><p class="small muted">Nemojte objavljivati kućnu adresu, broj telefona ili tačnu lokaciju u realnom vremenu. Datoteka do 30 MB; čuva se na uređaju.</p><div class="formactions"><button class="btn">💾 Sačuvaj objavu</button></div></form></section><section class="card" style="margin-top:14px"><h3>📝 Moje objave za deljenje</h3><div id="worldPosts">Učitavanje...</div></section>`}
async function worldLoad(){const el=document.getElementById('worldPosts');if(!el)return;worldMediaUrls.forEach(u=>URL.revokeObjectURL(u));worldMediaUrls=[];const posts=worldDrafts();let media=[];try{media=await galleryAll()}catch(e){console.warn('Media unavailable',e)}const byId=new Map(media.map(x=>[x.id,x]));el.innerHTML=posts.length?posts.map(x=>{const m=byId.get(x.mediaId);let mediaHtml='';if(m?.blob){const u=URL.createObjectURL(m.blob);worldMediaUrls.push(u);mediaHtml=m.type?.startsWith('video/')?`<video controls playsinline preload="metadata" src="${u}" style="width:100%;max-height:300px;border-radius:12px"></video>`:`<img alt="Objava o ljubimcu" loading="lazy" src="${u}" style="max-width:100%;max-height:300px;object-fit:contain;border-radius:12px">`}return `<div class="item"><div class="itemtitle"><span data-user-content>${esc(petName(x.petId))}</span> · ${esc(x.category)}</div><div class="small muted"><span data-user-content>${esc(x.country||'')}</span>${x.city?' · '+esc(x.city):''} · ${date(x.date)}</div><p style="white-space:pre-wrap"><span data-user-content>${esc(x.message)}</span></p>${mediaHtml}<div class="btnrow"><button class="btn secondary" data-world="share" data-id="${esc(x.id)}">📤 Podeli</button><button class="btn danger" data-world="delete" data-id="${esc(x.id)}">Obriši</button></div></div>`}).join(''):'<div class="empty">Još nema sačuvanih objava.</div>'}
async function worldAction(action,id){const posts=worldDrafts(),p=posts.find(x=>x.id===id);if(!p)return;if(action==='delete'){if(!confirm('Obrisati ovu objavu?'))return;worldSave(posts.filter(x=>x.id!==id));await worldLoad();return}if(action==='share'){const text=`🐾 Pet Care World\n${petName(p.petId)} · ${p.category}\n${p.city||''} ${p.country||''}\n${p.message}`;try{const media=(await galleryAll()).find(x=>x.id===p.mediaId);if(media?.blob){const file=new File([media.blob],media.name||'pet-care-media',{type:media.type});if(navigator.canShare?.({files:[file]})){await navigator.share({text,files:[file]});return}}if(navigator.share){await navigator.share({text});return}await navigator.clipboard.writeText(text);toast('Tekst objave kopiran.')}catch(e){if(e.name!=='AbortError')toast('Deljenje nije dostupno na ovom uređaju.')}}}
function worldWire(){const f=document.getElementById('worldForm');if(f)f.onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(f));const file=f.elements.media.files[0];if(file&&(!/^(image|video)\//.test(file.type)||file.size>30*1024*1024)){toast('Izaberite fotografiju ili video do 30 MB.');return}const b=f.querySelector('button.btn');b.disabled=true;try{let mediaId='';if(file){mediaId='world-'+uid()+uid();await galleryPut({id:mediaId,petId:v.petId,date:today(),caption:v.message.slice(0,100),name:file.name,type:file.type,blob:file,favorite:false})}worldSave([{id:uid()+uid(),petId:v.petId,category:v.category,country:v.country.trim(),city:v.city.trim(),message:v.message.trim(),date:today(),mediaId},...worldDrafts()]);f.reset();toast('Objava je privatno sačuvana.');await worldLoad()}catch(err){toast('Nije sačuvano: '+err.message)}finally{b.disabled=false}};document.getElementById('worldPosts')?.addEventListener('click',e=>{const b=e.target.closest('[data-world]');if(b)worldAction(b.dataset.world,b.dataset.id)});worldLoad()}
const worldPreviousRender=render;
render=function(){if(tab==='world'){renderChips();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.getElementById('content').innerHTML=data.pets.length?worldView():`<div class="notice">Dodajte ljubimca da biste kreirali objavu.</div><button class="btn" onclick="tab='pets';formMode='pet';render()">＋ Dodaj ljubimca</button>`;if(data.pets.length)worldWire();return}worldPreviousRender()};
const worldNav=document.createElement('button');worldNav.dataset.tab='world';worldNav.textContent='🌍 Pet Care World';document.getElementById('nav').insertBefore(worldNav,document.querySelector('#nav [data-tab="gallery"]')||document.querySelector('#nav [data-tab="premium"]'));

const petCareNav=document.getElementById('nav');
const petCareRender=render;
render=function(){petCareRender();if(tab==='home'||tab==='pets'){petCareNav.scrollLeft=0;}};
petCareNav.addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b&&['home','pets'].includes(b.dataset.tab))petCareNav.scrollLeft=0;});
render();
