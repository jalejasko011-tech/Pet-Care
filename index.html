<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#176b57">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="description" content="Pet Care helps you track your pet's health, reminders, food, weight and expenses.">
<title>Pet Care — Care for your pet</title>
<style>
:root{--green:#176b57;--green2:#e5f4ee;--ink:#18352d;--muted:#698078;--bg:#f4f8f6;--line:#dce8e2;--white:#fff;--orange:#f6b44b;--red:#c94e4e;--shadow:0 8px 28px #174b3b0d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1100px;margin:auto;min-height:100vh}.top{background:linear-gradient(120deg,#135b4a,#26866b);color:white;padding:22px 20px 26px;border-radius:0 0 26px 26px}.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:850;font-size:22px;letter-spacing:-.5px}.tag{opacity:.83;font-size:13px}.petselect{display:flex;gap:8px;overflow:auto;margin-top:18px;padding-bottom:2px}.petchip{border:1px solid #ffffff65;color:white;background:#ffffff16;border-radius:15px;padding:9px 13px;white-space:nowrap}.petchip.active{background:white;color:var(--green);font-weight:750}.main{padding:18px 16px 90px}.nav{display:flex;gap:7px;overflow:auto;padding:6px;background:#e8f1ec;border-radius:16px;margin-bottom:18px}.nav button{border:0;background:transparent;color:#557267;padding:10px 13px;border-radius:12px;white-space:nowrap;font-weight:650}.nav button.active{background:white;color:var(--green);box-shadow:0 2px 8px #123c2c12}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);min-width:0}.card h3{margin:0 0 10px;font-size:16px}.muted{color:var(--muted)}.small{font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:15px}.stat{background:white;border:1px solid var(--line);padding:14px;border-radius:16px}.stat strong{display:block;font-size:23px;letter-spacing:-.6px}.stat span{font-size:12px;color:var(--muted)}.row{display:flex;gap:12px;align-items:center}.avatar{width:58px;height:58px;border-radius:18px;background:var(--green2);display:grid;place-items:center;font-size:28px;flex-shrink:0;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.grow{flex:1;min-width:0}.pill{display:inline-block;background:var(--green2);color:var(--green);border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700}.btn{border:0;border-radius:12px;padding:10px 14px;background:var(--green);color:white;font-weight:700}.btn.secondary{background:var(--green2);color:var(--green)}.btn.ghost{background:transparent;color:var(--green);border:1px solid var(--line)}.btn.danger{background:#fff0f0;color:var(--red)}.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:2px 0 12px}.sectionhead h2{font-size:20px;margin:0;letter-spacing:-.4px}.item{padding:12px 0;border-bottom:1px solid #edf2ef}.item:last-child{border-bottom:0}.itemtitle{font-weight:750}.due{color:#a76b0c;background:#fff5df}.overdue{color:#b13e3e;background:#fff0f0}.empty{padding:24px 10px;text-align:center;color:var(--muted)}form .fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block;font-size:12px;font-weight:750;color:#547066;margin-bottom:5px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #d8e5de;border-radius:11px;background:#fbfdfc;color:var(--ink);outline:none}input:focus,select:focus,textarea:focus{border-color:#4d9b82;box-shadow:0 0 0 3px #dff1e9}textarea{min-height:78px;resize:vertical}.field.full{grid-column:1/-1}.formactions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.hidden{display:none!important}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #edf2ef;white-space:nowrap}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}.chart{width:100%;height:170px}.notice{background:#fff5df;border:1px solid #f4e1b7;border-radius:14px;padding:12px;margin-bottom:14px;font-size:13px}.footer{text-align:center;color:var(--muted);font-size:12px;margin:24px 0}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#173d31;color:white;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);z-index:10;max-width:90%;display:none}
@media(max-width:650px){.grid{grid-template-columns:1fr}.stats{gap:7px}.stat{padding:11px}.stat strong{font-size:20px}.main{padding:14px 12px 80px}.top{padding:19px 15px 22px}.nav button{padding:9px 11px}.sectionhead h2{font-size:18px}form .fields{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body><div class="app">
<header class="top"><div class="toprow"><div><div class="brand">🐾 Pet Care</div><div class="tag" id="tagline">Brinemo o svojim ljubimcima</div></div><div style="display:flex;gap:7px;align-items:center"><select id="languageSelect" aria-label="Language" style="width:auto;background:#ffffff18;color:white;border-color:#ffffff55;padding:8px"><option value="sr">🇷🇸 SR</option><option value="en">🇬🇧 EN</option></select><button class="btn secondary" id="exportBtn">Izvoz podataka</button></div></div><div class="petselect" id="petChips"></div></header>
<main class="main"><nav class="nav" id="nav">
<button class="active" data-tab="home">Pregled</button><button data-tab="pets">Ljubimci</button><button data-tab="health">Zdravlje</button><button data-tab="diary">Dnevnik</button><button data-tab="food">Ishrana</button><button data-tab="costs">Troškovi</button><button data-tab="reminders">Podsetnici</button><button data-tab="shop">Prodavnica</button><button data-tab="deals">Akcije</button><button data-tab="vets">Veterinari</button><button data-tab="premium">Premium</button><button data-tab="assistant">AI asistent</button>
</nav><div id="content"></div><div class="footer" id="footerNote">Pet Care • Podaci se čuvaju u ovom pregledaču na ovom uređaju.</div></main></div><div class="toast" id="toast"></div>
<script>
const KEY='petcare_data_v1';
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data=load(), activePet=data.pets[0]?.id||null, tab='home', formMode=null;
function seed(){return {pets:[],health:[],weights:[],logs:[],food:[],costs:[],reminders:[]}}
function load(){try{return {...seed(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return seed()}}
function save(){localStorage.setItem(KEY,JSON.stringify(data));window.petCareCloud?.save(data);window.petCareNative?.sync(data.reminders,data.pets).catch(e=>console.warn('Notification sync:',e))}
function pet(){return data.pets.find(p=>p.id===activePet)}
function money(n){return new Intl.NumberFormat('sr-RS',{style:'currency',currency:'RSD',maximumFractionDigits:0}).format(Number(n)||0)}
function date(s){if(!s)return '—';return new Date(s+'T12:00:00').toLocaleDateString('sr-RS')}
function age(d){if(!d)return '';let n=Math.floor((Date.now()-new Date(d).getTime())/31557600000);return n<1?'manje od godinu dana':`${n} ${n===1?'godina':'godina'}`}
function toast(s){let el=document.getElementById('toast');el.textContent=s;el.style.display='block';setTimeout(()=>el.style.display='none',2600)}
function petName(id){return data.pets.find(p=>p.id===id)?.name||'Nepoznat ljubimac'}
function renderChips(){let el=document.getElementById('petChips');el.innerHTML=data.pets.map(p=>`<button class="petchip ${p.id===activePet?'active':''}" data-pet="${p.id}">${p.photo?`<img src="${p.photo}" style="width:20px;height:20px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:5px">`:'🐾'} ${esc(p.name)}</button>`).join('')+`<button class="petchip" data-action="addpet">＋ Dodaj ljubimca</button>`;el.querySelectorAll('[data-pet]').forEach(b=>b.onclick=()=>{activePet=b.dataset.pet;render()});el.querySelector('[data-action="addpet"]').onclick=()=>{tab='pets';formMode='pet';render()}}
function header(title,btn=''){return `<div class="sectionhead"><h2>${title}</h2>${btn}</div>`}
function card(title,body){return `<section class="card"><h3>${title}</h3>${body}</section>`}
function list(items,fn,empty='Još nema unosa.'){return items.length?items.map(fn).join(''):`<div class="empty">${empty}</div>`}
function petFilter(arr){return arr.filter(x=>x.petId===activePet)}
function render(){renderChips();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let el=document.getElementById('content');if(!data.pets.length&&!['pets','shop','deals','vets','assistant'].includes(tab)){el.innerHTML=`<div class="notice">Dobro došli! Dodajte svoja dva psa (ili bilo kog drugog ljubimca) da biste počeli da pratite zdravlje, obaveze i troškove.</div><button class="btn" onclick="tab='pets';formMode='pet';render()">＋ Dodaj prvog ljubimca</button>`;return}el.innerHTML=({home:homeView,pets:petsView,health:healthView,diary:diaryView,food:foodView,costs:costsView,reminders:remindersView,shop:shopView,deals:dealsView,vets:vetsView,assistant:assistantView}[tab]||homeView)();wireForms()}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;formMode=null;render()}});
function homeView(){let p=pet(), hs=petFilter(data.health), due=[...hs,...petFilter(data.reminders)].filter(x=>x.nextDate&&x.nextDate<=new Date(Date.now()+30*864e5).toISOString().slice(0,10)).sort((a,b)=>a.nextDate.localeCompare(b.nextDate));let costs=petFilter(data.costs).filter(x=>x.date?.slice(0,4)===String(new Date().getFullYear())).reduce((s,x)=>s+(+x.amount||0),0);let w=petFilter(data.weights).sort((a,b)=>b.date.localeCompare(a.date))[0];return `${p?`<div class="card" style="margin-bottom:14px"><div class="row"><div class="avatar">${p.photo?`<img src="${p.photo}">`:(p.type==='Pas'?'🐕':p.type==='Mačka'?'🐈':p.type==='Ptica'?'🦜':'🐾')}</div><div class="grow"><div style="font-size:21px;font-weight:850">${esc(p.name)}</div><div class="muted">${esc(p.breed||p.type||'Ljubimac')}${p.birth?' · '+age(p.birth):''}</div><div class="pill" style="margin-top:6px">${esc(p.type||'Ljubimac')}</div></div><button class="btn secondary" onclick="tab='pets';render()">Profil</button></div></div>`:''}<div class="stats"><div class="stat"><strong>${w?esc(w.kg)+' kg':'—'}</strong><span>Poslednja težina</span></div><div class="stat"><strong>${due.length}</strong><span>Obaveze uskoro</span></div><div class="stat"><strong>${money(costs)}</strong><span>Troškovi ove godine</span></div></div><div class="grid"><section class="card"><h3>📅 Uskoro na redu</h3>${list(due.slice(0,5),x=>`<div class="item"><div class="itemtitle">${esc(x.title||x.name||x.kind||'Podsetnik')}</div><div class="muted small">${date(x.nextDate)} · ${esc(x.type||'Podsetnik')}</div></div>`,'Nema obaveza u narednih 30 dana.')}</section><section class="card"><h3>⚡ Brzi unos</h3><div class="btnrow"><button class="btn secondary" onclick="tab='diary';formMode='log';render()">＋ Dnevna beleška</button><button class="btn secondary" onclick="tab='health';formMode='health';render()">＋ Zdravstveni unos</button><button class="btn secondary" onclick="tab='costs';formMode='cost';render()">＋ Trošak</button><button class="btn secondary" onclick="tab='diary';formMode='weight';render()">＋ Težina</button></div></section></div>${card('Nedavne beleške',list(petFilter(data.logs).slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3),x=>`<div class="item"><div class="itemtitle">${date(x.date)} · ${esc(x.mood||'Dnevnik')}</div><div>${esc(x.note||'Bez dodatnih napomena')}</div><div class="muted small">Apetit: ${esc(x.appetite||'—')} · Stolica: ${esc(x.stool||'—')}</div></div>`,'Nema beležaka za ovog ljubimca.'))}`}
function petsView(){let p=pet();return `${header('Moji ljubimci',`<button class="btn" onclick="formMode='pet';render()">＋ Dodaj ljubimca</button>`)}${formMode==='pet'?petForm():''}<div class="grid">${list(data.pets,p=>`<section class="card"><div class="row"><div class="avatar">${p.photo?`<img src="${p.photo}">`:p.type==='Pas'?'🐕':p.type==='Mačka'?'🐈':p.type==='Ptica'?'🦜':'🐾'}</div><div class="grow"><div class="itemtitle">${esc(p.name)}</div><div class="muted">${esc(p.type)} · ${esc(p.breed||'Rasa nije uneta')}</div><div class="small muted">${p.birth?'Rođen/a: '+date(p.birth):''}</div></div></div><div class="btnrow"><button class="btn secondary" onclick="activePet='${p.id}';tab='home';render()">Otvori profil</button><button class="btn ghost" onclick="editPet('${p.id}')">Izmeni</button><button class="btn danger" onclick="deletePet('${p.id}')">Obriši</button></div></section>`,'Dodajte svog prvog ljubimca.')}</div>`}
function petForm(){let p=formMode?.startsWith('editpet:')?data.pets.find(x=>x.id===formMode.split(':')[1]):null;return `<section class="card" style="margin-bottom:14px"><h3>${p?'Izmena profila':'Novi profil ljubimca'}</h3><form id="petForm"><input type="hidden" name="id" value="${p?.id||''}"><div class="fields"><div><label>Ime *</label><input name="name" required value="${esc(p?.name||'')}" placeholder="Npr. Luna"></div><div><label>Vrsta *</label><select name="type"><option ${p?.type==='Pas'?'selected':''}>Pas</option><option ${p?.type==='Mačka'?'selected':''}>Mačka</option><option ${p?.type==='Ptica'?'selected':''}>Ptica</option><option ${p?.type==='Glodar'?'selected':''}>Glodar</option><option ${p?.type==='Ostalo'?'selected':''}>Ostalo</option></select></div><div><label>Rasa</label><input name="breed" value="${esc(p?.breed||'')}"></div><div><label>Pol</label><select name="sex"><option value="">Nije navedeno</option><option ${p?.sex==='Mužjak'?'selected':''}>Mužjak</option><option ${p?.sex==='Ženka'?'selected':''}>Ženka</option></select></div><div><label>Datum rođenja</label><input type="date" name="birth" value="${p?.birth||''}"></div><div><label>Broj čipa</label><input name="chip" value="${esc(p?.chip||'')}"></div><div><label>Broj pasoša</label><input name="passport" value="${esc(p?.passport||'')}"></div><div><label>Trenutna težina (kg)</label><input type="number" step=".01" min="0" name="kg" value="${p?.kg||''}"></div><div class="field full"><label>Profilna slika</label><input type="file" name="photo" accept="image/*"><div class="small muted">Slika se čuva lokalno; preporučena je manja fotografija.</div></div></div><div class="formactions"><button type="button" class="btn ghost" onclick="formMode=null;render()">Otkaži</button><button class="btn">Sačuvaj profil</button></div></form></section>`}
function editPet(id){formMode='editpet:'+id;tab='pets';render()}
function deletePet(id){if(!confirm('Obrisati profil i sve podatke ovog ljubimca?'))return;data.pets=data.pets.filter(x=>x.id!==id);for(let k of ['health','weights','logs','food','costs','reminders'])data[k]=data[k].filter(x=>x.petId!==id);if(activePet===id)activePet=data.pets[0]?.id||null;save();render();toast('Profil je obrisan.')}
function healthView(){let arr=petFilter(data.health);return `${header('Zdravstveni karton',`<button class="btn" onclick="formMode='health';render()">＋ Dodaj zapis</button>`)}${formMode==='health'?healthForm():''}<div class="grid"><section class="card"><h3>💉 Vakcinacije i tretmani</h3>${list(arr.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')),x=>`<div class="item"><div class="row"><div class="grow"><div class="itemtitle">${esc(x.title)}</div><div class="muted small">${esc(x.category)} · primena: ${date(x.date)}</div><div class="small">${x.nextDate?`Sledeći datum: <b>${date(x.nextDate)}</b>`:''} ${x.duration?`· Zaštita ${x.duration} dana`:''}</div>${x.notes?`<div class="small muted">${esc(x.notes)}</div>`:''}</div><button class="btn ghost" onclick="del('health','${x.id}')">×</button></div></div>`,'Nema zdravstvenih zapisa.')}</section><section class="card"><h3>🩺 Medicinski podaci</h3><div class="item"><div class="itemtitle">Alergije</div><div>${esc(pet()?.allergies||'Nisu unete')}</div></div><div class="item"><div class="itemtitle">Hronična stanja / terapije</div><div>${esc(pet()?.medical||'Nisu uneti podaci')}</div></div><button class="btn secondary" onclick="formMode='medical';render()">Izmeni medicinske podatke</button>${formMode==='medical'?medicalForm():''}</section><section class="card"><h3>☎️ Veterinar</h3><div class="item"><div class="itemtitle">${esc(pet()?.vetName||'Nije unet veterinar')}</div><div class="muted">${esc(pet()?.clinic||'')}</div><div>${esc(pet()?.phone||'')}</div></div>${pet()?.phone?`<a class="btn secondary" href="tel:${esc(pet().phone)}" style="display:inline-block;text-decoration:none">Pozovi veterinara</a>`:''}<button class="btn ghost" style="margin-left:6px" onclick="formMode='vet';render()">Izmeni</button>${formMode==='vet'?vetForm():''}</section></div>`}
function healthForm(){return `<section class="card" style="margin-bottom:14px"><h3>Novi zdravstveni zapis</h3><form id="healthForm"><div class="fields"><div><label>Vrsta zapisa</label><select name="category"><option>Vakcinacija</option><option>Spoljašnji paraziti</option><option>Unutrašnji paraziti</option><option>Pregled veterinara</option><option>Terapija / lek</option><option>Drugo</option></select></div><div><label>Naziv vakcine / preparata *</label><input name="title" required placeholder="Naziv preparata"></div><div><label>Datum primene</label><input type="date" name="date" value="${today()}"></div><div><label>Sledeći datum / obnova zaštite</label><input type="date" name="nextDate"></div><div><label>Trajanje zaštite (dana, opciono)</label><input type="number" min="1" name="duration" placeholder="Npr. 30"></div><div class="field full"><label>Napomene</label><textarea name="notes"></textarea></div></div><div class="formactions"><button type="button" class="btn ghost" onclick="formMode=null;render()">Otkaži</button><button class="btn">Sačuvaj zapis</button></div></form></section>`}
function medicalForm(){return `<form id="medicalForm"><label>Alergije</label><textarea name="allergies">${esc(pet()?.allergies||'')}</textarea><label>Hronična stanja i terapije</label><textarea name="medical">${esc(pet()?.medical||'')}</textarea><div class="formactions"><button class="btn">Sačuvaj</button></div></form>`}
function vetForm(){return `<form id="vetForm"><label>Ime veterinara</label><input name="vetName" value="${esc(pet()?.vetName||'')}"><label>Ordinacija</label><input name="clinic" value="${esc(pet()?.clinic||'')}"><label>Telefon</label><input name="phone" type="tel" value="${esc(pet()?.phone||'')}"><div class="formactions"><button class="btn">Sačuvaj</button></div></form>`}
function diaryView(){let logs=petFilter(data.logs).slice().sort((a,b)=>b.date.localeCompare(a.date)),weights=petFilter(data.weights).slice().sort((a,b)=>a.date.localeCompare(b.date));return `${header('Dnevnik i težina',`<div class="btnrow" style="margin:0"><button class="btn secondary" onclick="formMode='weight';render()">＋ Težina</button><button class="btn" onclick="formMode='log';render()">＋ Beleška</button></div>`)}${formMode==='log'?logForm():''}${formMode==='weight'?weightForm():''}<div class="grid"><section class="card"><h3>⚖️ Promena težine</h3>${weights.length?`<svg class="chart" viewBox="0 0 500 170" role="img" aria-label="Grafikon težine">${weightSvg(weights)}</svg><div class="tablewrap"><table><thead><tr><th>Datum</th><th>Težina</th><th></th></tr></thead><tbody>${weights.slice().reverse().map(w=>`<tr><td>${date(w.date)}</td><td>${esc(w.kg)} kg</td><td><button class="btn ghost" onclick="del('weights','${w.id}')">×</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Unesite nekoliko merenja da biste videli grafikon.</div>'}</section><section class="card"><h3>📝 Dnevne beleške</h3>${list(logs,x=>`<div class="item"><div class="row"><div class="grow"><div class="itemtitle">${date(x.date)} · ${esc(x.mood||'Beleška')}</div><div class="small muted">Apetit: ${esc(x.appetite||'—')} · Stolica: ${esc(x.stool||'—')}</div><div>${esc(x.note||'Bez napomena')}</div>${x.symptoms?`<div class="small">Simptomi: ${esc(x.symptoms)}</div>`:''}</div><button class="btn ghost" onclick="del('logs','${x.id}')">×</button></div></div>`,'Još nema dnevnih beleški.')}</section></div>`}
function weightSvg(ws){let arr=ws.slice(-12),vals=arr.map(x=>+x.kg),min=Math.min(...vals),max=Math.max(...vals);if(min===max){min-=1;max+=1}let pts=arr.map((x,i)=>`${25+i*450/Math.max(1,arr.length-1)},${140-(x.kg-min)/(max-min)*110}`).join(' ');return `<line x1="20" y1="140" x2="480" y2="140" stroke="#dce8e2"/><polyline points="${pts}" fill="none" stroke="#238469" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${arr.map((x,i)=>{let px=25+i*450/Math.max(1,arr.length-1),py=140-(x.kg-min)/(max-min)*110;return `<circle cx="${px}" cy="${py}" r="4" fill="#176b57"/><text x="${px}" y="160" text-anchor="middle" font-size="10" fill="#698078">${esc(x.date.slice(5))}</text>`}).join('')}<text x="4" y="16" font-size="11" fill="#698078">${max.toFixed(1)} kg</text><text x="4" y="135" font-size="11" fill="#698078">${min.toFixed(1)}</text>`}
function logForm(){return `<section class="card" style="margin-bottom:14px"><h3>Dnevna beleška</h3><form id="logForm"><div class="fields"><div><label>Datum</label><input type="date" name="date" value="${today()}"></div><div><label>Nivo energije</label><select name="mood"><option>Uobičajen</option><option>Veseo / energičan</option><option>Mirniji nego obično</option><option>Bezvoljan</option></select></div><div><label>Apetit</label><select name="appetite"><option>Normalan</option><option>Pojačan</option><option>Smanjen</option><option>Odbija hranu</option></select></div><div><label>Stolica</label><select name="stool"><option>Normalna</option><option>Mekana</option><option>Proliv</option><option>Zatvor</option><option>Nije praćeno</option></select></div><div class="field full"><label>Simptomi</label><input name="symptoms" placeholder="Npr. kašalj, češanje..."></div><div class="field full"><label>Napomene</label><textarea name="note" placeholder="Kako se ljubimac danas osećao?"></textarea></div></div><div class="formactions"><button type="button" class="btn ghost" onclick="formMode=null;render()">Otkaži</button><button class="btn">Sačuvaj</button></div></form></section>`}
function weightForm(){return `<section class="card" style="margin-bottom:14px"><h3>Unos težine</h3><form id="weightForm"><div class="fields"><div><label>Datum</label><input type="date" name="date" value="${today()}"></div><div><label>Težina (kg) *</label><input type="number" step=".01" min=".01" name="kg" required></div></div><div class="formactions"><button type="button" class="btn ghost" onclick="formMode=null;render()">Otkaži</button><button class="btn">Sačuvaj</button></div></form></section>`}
function foodView(){let arr=petFilter(data.food);return `${header('Ishrana',`<button class="btn" onclick="formMode='food';render()">＋ Dodaj ishranu</button>`)}${formMode==='food'?foodForm():''}<div class="grid"><section class="card"><h3>🥣 Plan ishrane</h3>${list(arr,x=>`<div class="item"><div class="row"><div class="grow"><div class="itemtitle">${esc(x.name)}</div><div class="muted small">${esc(x.grams||'—')} g dnevno ${x.brand?'· '+esc(x.brand):''}</div>${x.notes?`<div>${esc(x.notes)}</div>`:''}</div><button class="btn ghost" onclick="del('food','${x.id}')">×</button></div></div>`,'Nije uneta hrana.')}</section><section class="card"><h3>💡 Napomena</h3><p class="muted">Preporučenu dnevnu količinu prilagodite uzrastu, težini, aktivnosti i savetu veterinara. Ovde možete beležiti i posebnu dijetu ili intolerancije.</p></section></div>`}
function foodForm(){return `<section class="card" style="margin-bottom:14px"><h3>Nova stavka ishrane</h3><form id="foodForm"><div class="fields"><div><label>Naziv hrane *</label><input name="name" required></div><div><label>Brend / tip</label><input name="brand" placeholder="Suva, mokra, domaća..."></div><div><label>Dnevna količina (g)</label><input type="number" min="0" name="grams"></div><div class="field full"><label>Napomene / dijeta</label><textarea name="notes"></textarea></div></div><div class="formactions"><button type="button" class="btn ghost" onclick="formMode=null;render()">Otkaži</button><button class="btn">Sačuvaj</button></div></form></section>`}
function costsView(){let arr=petFilter(data.costs).slice().sort((a,b)=>b.date.localeCompare(a.date)),year=new Date().getFullYear(),yr=arr.filter(x=>x.date?.startsWith(String(year))).reduce((s,x)=>s+(+x.amount||0),0),month=arr.filter(x=>x.date?.startsWith(today().slice(0,7))).reduce((s,x)=>s+(+x.amount||0),0);return `${header('Troškovi',`<button class="btn" onclick="formMode='cost';render()">＋ Dodaj trošak</button>`)}${formMode==='cost'?costForm():''}<div class="stats"><div class="stat"><strong>${money(month)}</strong><span>Ovaj mesec</span></div><div class="stat"><strong>${money(yr)}</strong><span>Ova godina</span></div><div class="stat"><strong>${arr.length}</strong><span>Ukupno stavki</span></div></div><section class="card"><div class="tablewrap"><table><thead><tr><th>Datum</th><th>Kategorija</th><th>Opis</th><th>Iznos</th><th></th></tr></thead><tbody>${arr.map(x=>`<tr><td>${date(x.date)}</td><td>${esc(x.category)}</td><td>${esc(x.note||'—')}</td><td><b>${money(x.amount)}</b></td><td><button class="btn ghost" onclick="del('costs','${x.id}')">×</button></td></tr>`).join('')||'<tr><td colspan="5" class="muted">Još nema troškova.</td></tr>'}</tbody></table></div></section>`}
function costForm(){return `<section class="card" style="margin-bottom:14px"><h3>Novi trošak</h3><form id="costForm"><div class="fields"><div><label>Datum</label><input type="date" name="date" value="${today()}"></div><div><label>Kategorija</label><select name="category"><option>Hrana</option><option>Veterinar</option><option>Oprema</option><option>Gruming</option><option>Lekovi</option><option>Ostalo</option></select></div><div><label>Iznos (RSD) *</label><input type="number" min="0" step=".01" name="amount" required></div><div><label>Opis</label><input name="note" placeholder="Npr. godišnja vakcina"></div></div><div class="formactions"><button type="button" class="btn ghost" onclick="formMode=null;render()">Otkaži</button><button class="btn">Sačuvaj</button></div></form></section>`}
function remindersView(){let arr=petFilter(data.reminders).slice().sort((a,b)=>(a.nextDate||'').localeCompare(b.nextDate||''));return `${header('Podsetnici',`<button class="btn" onclick="formMode='reminder';render()">＋ Dodaj podsetnik</button>`)}<div class="notice">Podsetnici su trenutno prikazani unutar aplikacije. Za pouzdane push notifikacije i obaveštenja kada je aplikacija zatvorena potrebna je instalirana aplikacija ili serverska/push infrastruktura. Možete uključiti i obaveštenja pregledača dok je ova stranica otvorena.</div><div class="btnrow" style="margin:0 0 14px"><button class="btn secondary" onclick="enableNotifications()">Uključi obaveštenja pregledača</button></div>${formMode==='reminder'?reminderForm():''}<section class="card"><h3>🔔 Moji podsetnici</h3>${list(arr,x=>`<div class="item"><div class="row"><div class="grow"><div class="itemtitle">${esc(x.title)}</div><div class="muted small">${esc(x.kind)} · ${date(x.nextDate)}${x.time?' · '+esc(x.time):''}</div>${x.notes?`<div class="small">${esc(x.notes)}</div>`:''}<span class="pill ${x.nextDate<today()?'overdue':x.nextDate<=new Date(Date.now()+7*864e5).toISOString().slice(0,10)?'due':''}">${x.nextDate<today()?'Prošao rok':x.nextDate===today()?'Danas':'Planirano'}</span></div><button class="btn ghost" onclick="del('reminders','${x.id}')">×</button></div></div>`,'Još nema podsetnika.')}</section>`}
function reminderForm(){return `<section class="card" style="margin-bottom:14px"><h3>Novi podsetnik</h3><form id="reminderForm"><div class="fields"><div><label>Naziv *</label><input name="title" required placeholder="Npr. Večernji lek"></div><div><label>Tip</label><select name="kind"><option>Hrana</option><option>Lek</option><option>Šetnja</option><option>Veterinar</option><option>Gruming</option><option>Vakcinacija</option><option>Zaštita od parazita</option><option>Ostalo</option></select></div><div><label>Datum *</label><input type="date" name="nextDate" required value="${today()}"></div><div><label>Vreme (opciono)</label><input type="time" name="time"></div><div class="field full"><label>Napomena</label><textarea name="notes"></textarea></div></div><div class="formactions"><button type="button" class="btn ghost" onclick="formMode=null;render()">Otkaži</button><button class="btn">Sačuvaj</button></div></form></section>`}
function wireForms(){bind('petForm',async f=>{let o=Object.fromEntries(new FormData(f));let old=o.id?data.pets.find(p=>p.id===o.id):null;let photo=old?.photo||'';let file=f.elements.photo.files[0];if(file){photo=await new Promise(res=>{let r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(file)})}let p={...old,...o,id:o.id||uid(),photo,kg:o.kg||old?.kg||''};if(!data.pets.some(x=>x.id===p.id))data.pets.push(p);else data.pets=data.pets.map(x=>x.id===p.id?p:x);activePet=p.id;if(p.kg){data.weights.push({id:uid(),petId:p.id,date:today(),kg:p.kg})}formMode=null;save();render();toast('Profil je sačuvan.')});
bind('healthForm',f=>{data.health.push({...Object.fromEntries(new FormData(f)),id:uid(),petId:activePet});formMode=null;save();render();toast('Zdravstveni zapis je sačuvan.')});
bind('medicalForm',f=>{Object.assign(pet(),Object.fromEntries(new FormData(f)));formMode=null;save();render();toast('Medicinski podaci su sačuvani.')});
bind('vetForm',f=>{Object.assign(pet(),Object.fromEntries(new FormData(f)));formMode=null;save();render();toast('Veterinar je sačuvan.')});
bind('logForm',f=>{data.logs.push({...Object.fromEntries(new FormData(f)),id:uid(),petId:activePet});formMode=null;save();render();toast('Beleška je sačuvana.')});
bind('weightForm',f=>{let o=Object.fromEntries(new FormData(f));data.weights.push({...o,id:uid(),petId:activePet});if(pet())pet().kg=o.kg;formMode=null;save();render();toast('Težina je sačuvana.')});
bind('foodForm',f=>{data.food.push({...Object.fromEntries(new FormData(f)),id:uid(),petId:activePet});formMode=null;save();render();toast('Ishrana je sačuvana.')});
bind('costForm',f=>{data.costs.push({...Object.fromEntries(new FormData(f)),id:uid(),petId:activePet});formMode=null;save();render();toast('Trošak je sačuvan.')});
bind('reminderForm',f=>{data.reminders.push({...Object.fromEntries(new FormData(f)),id:uid(),petId:activePet});formMode=null;save();render();toast('Podsetnik je sačuvan.')})}
function bind(id,fn){let f=document.getElementById(id);if(f)f.onsubmit=e=>{e.preventDefault();fn(f)}}
function del(k,id){if(confirm('Obrisati ovaj unos?')){data[k]=data[k].filter(x=>x.id!==id);save();render();toast('Unos je obrisan.')}}
async function enableNotifications(){if(window.Capacitor?.Plugins?.LocalNotifications){try{const ok=await window.petCareNative.enable();if(ok){await window.petCareNative.sync(data.reminders,data.pets);toast('Obaveštenja na telefonu su uključena.')}else toast('Dozvola nije odobrena.')}catch(e){toast('Obaveštenja nisu dostupna: '+e.message)}return}if(!('Notification'in window)){toast('Ovaj pregledač ne podržava obaveštenja.');return}let p=await Notification.requestPermission();if(p==='granted'){new Notification('Pet Care',{body:'Obaveštenja su uključena dok pregledač podržava ovu stranicu.'});toast('Dozvola za obaveštenja je uključena.')}else toast('Dozvola nije odobrena.')}
document.getElementById('exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='sapica-backup-'+today()+'.json';a.click();URL.revokeObjectURL(url);toast('Backup je preuzet.')};

function translateUI(){
  const lang=currentLang();
  document.documentElement.lang=lang;
  const sel=document.getElementById('languageSelect'); if(sel)sel.value=lang;
  const tag=document.getElementById('tagline'); if(tag)tag.textContent=lang==='en'?'Caring for the pets we love':'Brinemo o svojim ljubimcima';
  const ex=document.getElementById('exportBtn');if(ex)ex.textContent=lang==='en'?'Export data':'Izvoz podataka';
  document.querySelectorAll('#nav button').forEach(b=>{if(!b.dataset.original)b.dataset.original=b.textContent.trim();b.textContent=translateText(b.dataset.original)});
  const foot=document.getElementById('footerNote');if(foot)foot.textContent=lang==='en'?'Pet Care • Data is stored in this browser on this device.':'Pet Care • Podaci se čuvaju u ovom pregledaču na ovom uređaju.';
  const root=document.getElementById('content');
  if(root){
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
    nodes.forEach(n=>{if(!n.__srOriginal)n.__srOriginal=n.nodeValue; n.nodeValue=translateText(n.__srOriginal)});
    root.querySelectorAll('input[placeholder],textarea[placeholder]').forEach(el=>{if(!el.dataset.srPlaceholder)el.dataset.srPlaceholder=el.placeholder;el.placeholder=translateText(el.dataset.srPlaceholder)});
    root.querySelectorAll('option').forEach(el=>{if(!el.dataset.srText)el.dataset.srText=el.textContent;el.textContent=translateText(el.dataset.srText)});
    root.querySelectorAll('label').forEach(el=>{if(!el.dataset.srText)el.dataset.srText=el.textContent;el.textContent=translateText(el.dataset.srText)});
  }
}

<script>
// Uses Capacitor's injected native bridge in Android/iOS builds; does nothing on the web.
window.petCareNative = {
 async enable(){
   const api=window.Capacitor?.Plugins?.LocalNotifications;
   if(!api) return false;
   const p=await api.requestPermissions();return p.display==='granted';
 },
 async sync(reminders,pets){
   const api=window.Capacitor?.Plugins?.LocalNotifications;
   if(!api)return {native:false};
   const p=await api.checkPermissions();if(p.display!=='granted')return {native:true,permission:false};
   const old=await api.getPending();
   const own=(old.notifications||[]).filter(n=>n.extra?.petCare).map(n=>({id:n.id}));
   if(own.length)await api.cancel({notifications:own});
   const now=Date.now(), scheduled=[];
   for(const r of reminders){
     if(!r.nextDate)continue;
     const at=new Date(r.nextDate+'T'+(r.time||'09:00')+':00');
     if(!Number.isFinite(at.getTime())||at.getTime()<=now)continue;
     const pet=pets.find(p=>p.id===r.petId);
     const hash=Array.from(String(r.id)).reduce((h,c)=>(Math.imul(h,31)+c.charCodeAt(0))|0,7);
     scheduled.push({id:Math.abs(hash)%2000000000+1,title:'Pet Care · '+(pet?.name||'Ljubimac'),body:r.title||'Podsetnik',schedule:{at:at.toISOString()},extra:{petCare:true}});
   }
   if(scheduled.length)await api.schedule({notifications:scheduled.slice(0,64)});
   return {native:true,permission:true,count:Math.min(scheduled.length,64)};
 }
};
</script>
