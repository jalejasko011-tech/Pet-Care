name: Build signed Pet Care World release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check signing configuration
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Configure all four Android signing secrets before building a release."
            exit 1
          fi
      - name: Install and prepare Android
        run: |
          npm install
          npx cap add android
          node tools/configure-android.mjs
          npx cap sync android
      - name: Validate web application
        run: npm run check:web
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build unsigned release
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Sign release APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/zipalign" -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$RUNNER_TEMP/Pet-Care-World-release.apk" \
            "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose "$RUNNER_TEMP/Pet-Care-World-release.apk"
          mkdir -p release
          cp "$RUNNER_TEMP/Pet-Care-World-release.apk" release/
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Pet-Care-World-Signed-Release
          path: release/Pet-Care-World-release.apk
          retention-days: 7

      - name: Build Android App Bundle for Google Play
        run: |
          cd android
          ./gradlew bundleRelease
      - name: Sign and verify Google Play AAB
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          mkdir -p release
          jarsigner -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -keypass:env ANDROID_KEY_PASSWORD \
            -signedjar release/Pet-Care-World-release.aab \
            android/app/build/outputs/bundle/release/app-release.aab \
            "$ANDROID_KEY_ALIAS"
          jarsigner -verify release/Pet-Care-World-release.aab
      - name: Upload Google Play App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Pet-Care-World-Google-Play-AAB
          path: release/Pet-Care-World-release.aab
          retention-days: 7

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release identity
        run: |
          python - <<'PYTHON'
          import json, os, pathlib, re
          version=json.loads(pathlib.Path('package.json').read_text())['version']
          if not re.fullmatch(r'\d+\.\d+\.\d+',version): raise SystemExit('Invalid release version')
          match=re.search(r"'versionCode (\d+)'",pathlib.Path('tools/configure-android.mjs').read_text())
          if not match: raise SystemExit('Missing Android version code')
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write(f'PETCARE_RELEASE_VERSION={version}\nPETCARE_RELEASE_CODE={match[1]}\n')
          PYTHON
      - uses: actions/download-artifact@v4
        with:
          name: Pet-Care-World-Signed-Release
          path: release
      - name: Require quality checks for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess, time
          for attempt in range(60):
              runs=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs?head_sha={os.environ["GITHUB_SHA"]}&per_page=30']))['workflow_runs']
              checks=[r for r in runs if r['name']=='Pet Care quality checks' and r['event']=='push']
              if checks and checks[0]['status']=='completed':
                  if checks[0]['conclusion']!='success': raise SystemExit('Quality checks failed; release not published')
                  break
              time.sleep(20)
          else: raise SystemExit('Quality checks did not complete; release not published')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: Pet-Care-World-Google-Play-AAB
          path: release
      - name: Package Play submission materials and genuine Android screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYTHON'
          import json, os, pathlib, shutil, subprocess, zipfile
          version=os.environ['PETCARE_RELEASE_VERSION']; code=os.environ['PETCARE_RELEASE_CODE']
          root=pathlib.Path(f'release/Play-Submission-{version}')
          root.mkdir(parents=True)
          shutil.copy('release/Pet-Care-World-release.aab',root/f'Pet-Care-World-{version}.aab')
          shutil.copytree('store-listing',root/'store-listing')
          (root/'docs').mkdir()
          for name in ['RELEASE_1_8_STATUS.md','PHONE_ACCEPTANCE_TEST.md','PLAY_STORE_RELEASE_CHECKLIST.md','GOOGLE_PLAY_DATA_SAFETY_REVIEW.md','CHAT_PUSH_ACTIVATION.md','CHAT_MEDIA_ACTIVATION.md','LANGUAGES.md','PHONE_ACCEPTANCE_1_8_4_SR.md','RELEASE_1_8_4.md','FAMILY_MODE_REQUIREMENTS_SR.md','RELEASE_1_8_5.md','RELEASE_1_8_6.md','RELEASE_1_8_7.md','RELEASE_1_8_8.md','RELEASE_1_8_9.md','RELEASE_1_8_10.md','RELEASE_1_8_11.md','RELEASE_1_8_12.md','RELEASE_1_8_14.md','RELEASE_1_8_15.md','RELEASE_1_8_16.md','RELEASE_1_8_17.md','RELEASE_1_8_18.md','RELEASE_1_8_19.md','RELEASE_1_8_20.md','PLAY_CONSOLE_ANSWERS_1_8_20_SR.md','START_PLAY_TEST_1_8_20_SR.md','TESTER_GUIDE_1_8_20_SR.md','ACCEPTANCE_1_8_20_SR.md','PRODUCTION_FAMILY_ACCEPTANCE_1_8_20_SR.md','OWNER_ACCOUNT_DELETION_SR.md','FIREBASE_REVIEW_2026_10_26_SR.md','TESTER_TRACKER_TEMPLATE.csv','PLAY_CONSOLE_ANSWERS_1_8_17_SR.md','PLAY_READINESS_2026_10_21_SR.md','SHARED_FAMILY_ACTIVATION_SR.md']:
              shutil.copy(pathlib.Path('docs')/name,root/'docs'/name)
          repo=os.environ['GITHUB_REPOSITORY']
          runs=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs?head_sha={os.environ["GITHUB_SHA"]}&per_page=30']))['workflow_runs']
          run=next(r for r in runs if r['name']=='Pet Care quality checks' and r['event']=='push' and r['conclusion']=='success')
          artifacts=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run["id"]}/artifacts']))['artifacts']
          item=next(a for a in artifacts if a['name']=='android-smoke-evidence')
          evidence=pathlib.Path('release/android-evidence.zip')
          evidence.write_bytes(subprocess.check_output(['gh','api',f'repos/{repo}/actions/artifacts/{item["id"]}/zip']))
          shots=root/'store-listing'/'screenshots';shots.mkdir()
          with zipfile.ZipFile(evidence) as z:
              for name in ['store-home.png','store-feeding.png','store-memories.png','store-settings.png']:
                  entry=next(i for i in z.infolist() if pathlib.PurePosixPath(i.filename).name==name)
                  if entry.file_size>8*1024*1024: raise SystemExit('Screenshot exceeds size limit')
                  (shots/name).write_bytes(z.read(entry))
          (root/'BUILD.txt').write_text(f'Version {version} ({code})\nCommit {os.environ["GITHUB_SHA"]}\nQuality run {run["id"]}\nOwner confirmed phone alarms including reboot on 23 October 2026. Other device/operational and Play gates remain; see release documents.\n')
          shutil.make_archive(f'release/Play-Submission-{version}','zip','release',f'Play-Submission-{version}')
          PYTHON
      - name: Publish verified version downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$PETCARE_RELEASE_VERSION"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Release already exists; preserving existing release.'
            exit 0
          fi
          cp release/Pet-Care-World-release.apk "release/Pet-Care-World-$version.apk"
          cd release
          zip "Pet-Care-World-$version.zip" "Pet-Care-World-$version.apk"
          sha256sum "Pet-Care-World-$version.apk" "Pet-Care-World-$version.zip" "Play-Submission-$version.zip" > SHA256SUMS.txt
          notes="../docs/RELEASE_${version//./_}.md"
          test -f "$notes"
          cp "$notes" release-notes.txt
          printf '\nInstall over the existing app without uninstalling. ZIP contains the same APK. This is not a Google Play approval.\n' >> release-notes.txt
          gh release create "$tag" "Pet-Care-World-$version.apk" "Pet-Care-World-$version.zip" "Play-Submission-$version.zip" SHA256SUMS.txt --target "$GITHUB_SHA" --title "Pet Care World $version" --notes-file release-notes.txt
