name: Build signed Pet Care World release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check signing configuration
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Configure all four Android signing secrets before building a release."
            exit 1
          fi
      - name: Install and prepare Android
        run: |
          npm install
          npx cap add android
          node tools/configure-android.mjs
          npx cap sync android
      - name: Validate web application
        run: npm run check:web
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build unsigned release
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Sign release APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/zipalign" -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$RUNNER_TEMP/Pet-Care-World-release.apk" \
            "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose "$RUNNER_TEMP/Pet-Care-World-release.apk"
          mkdir -p release
          cp "$RUNNER_TEMP/Pet-Care-World-release.apk" release/
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Pet-Care-World-Signed-Release
          path: release/Pet-Care-World-release.apk
          retention-days: 7

      - name: Build Android App Bundle for Google Play
        run: |
          cd android
          ./gradlew bundleRelease
      - name: Sign and verify Google Play AAB
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          mkdir -p release
          jarsigner -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -keypass:env ANDROID_KEY_PASSWORD \
            -signedjar release/Pet-Care-World-release.aab \
            android/app/build/outputs/bundle/release/app-release.aab \
            "$ANDROID_KEY_ALIAS"
          jarsigner -verify release/Pet-Care-World-release.aab
      - name: Upload Google Play App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Pet-Care-World-Google-Play-AAB
          path: release/Pet-Care-World-release.aab
          retention-days: 7

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Pet-Care-World-Signed-Release
          path: release
      - name: Require quality checks for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess, time
          for attempt in range(60):
              runs=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs?head_sha={os.environ["GITHUB_SHA"]}&per_page=30']))['workflow_runs']
              checks=[r for r in runs if r['name']=='Pet Care quality checks' and r['event']=='push']
              if checks and checks[0]['status']=='completed':
                  if checks[0]['conclusion']!='success': raise SystemExit('Quality checks failed; release not published')
                  break
              time.sleep(20)
          else: raise SystemExit('Quality checks did not complete; release not published')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: Pet-Care-World-Google-Play-AAB
          path: release
      - name: Package Play submission materials and genuine Android screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYTHON'
          import json, os, pathlib, shutil, subprocess, zipfile
          root=pathlib.Path('release/Play-Submission-1.8.9')
          root.mkdir(parents=True)
          shutil.copy('release/Pet-Care-World-release.aab',root/'Pet-Care-World-1.8.9.aab')
          shutil.copytree('store-listing',root/'store-listing')
          (root/'docs').mkdir()
          for name in ['RELEASE_1_8_STATUS.md','PHONE_ACCEPTANCE_TEST.md','PLAY_STORE_RELEASE_CHECKLIST.md','GOOGLE_PLAY_DATA_SAFETY_REVIEW.md','CHAT_PUSH_ACTIVATION.md','CHAT_MEDIA_ACTIVATION.md','LANGUAGES.md','PHONE_ACCEPTANCE_1_8_4_SR.md','RELEASE_1_8_4.md','FAMILY_MODE_REQUIREMENTS_SR.md','RELEASE_1_8_5.md','RELEASE_1_8_6.md','RELEASE_1_8_7.md','RELEASE_1_8_8.md','RELEASE_1_8_9.md','SHARED_FAMILY_ACTIVATION_SR.md']:
              shutil.copy(pathlib.Path('docs')/name,root/'docs'/name)
          repo=os.environ['GITHUB_REPOSITORY']
          runs=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs?head_sha={os.environ["GITHUB_SHA"]}&per_page=30']))['workflow_runs']
          run=next(r for r in runs if r['name']=='Pet Care quality checks' and r['event']=='push' and r['conclusion']=='success')
          artifacts=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run["id"]}/artifacts']))['artifacts']
          item=next(a for a in artifacts if a['name']=='android-smoke-evidence')
          evidence=pathlib.Path('release/android-evidence.zip')
          evidence.write_bytes(subprocess.check_output(['gh','api',f'repos/{repo}/actions/artifacts/{item["id"]}/zip']))
          shots=root/'store-listing'/'screenshots';shots.mkdir()
          with zipfile.ZipFile(evidence) as z:
              for name in ['store-home.png','store-feeding.png','store-memories.png','store-settings.png']:
                  entry=next(i for i in z.infolist() if pathlib.PurePosixPath(i.filename).name==name)
                  if entry.file_size>8*1024*1024: raise SystemExit('Screenshot exceeds size limit')
                  (shots/name).write_bytes(z.read(entry))
          (root/'BUILD.txt').write_text(f'Version 1.8.9 (20)\nCommit {os.environ["GITHUB_SHA"]}\nQuality run {run["id"]}\nPhysical phone testing and Play publication pending.\n')
          shutil.make_archive('release/Play-Submission-1.8.9','zip','release','Play-Submission-1.8.9')
          PYTHON
      - name: Publish version 1.8.9 downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.8.9 >/dev/null 2>&1; then
            echo 'Version 1.8.9 already exists; preserving existing release.'
            exit 0
          fi
          cp release/Pet-Care-World-release.apk release/Pet-Care-World-1.8.9.apk
          cd release
          zip Pet-Care-World-1.8.9.zip Pet-Care-World-1.8.9.apk
          sha256sum Pet-Care-World-1.8.9.apk Pet-Care-World-1.8.9.zip Play-Submission-1.8.9.zip > SHA256SUMS.txt
          cat > release-notes.txt <<'EOF'
          Pet Care World 1.8.9 puts Family care directly in the main navigation beside Home, Pets, Health, Memories and More. Narrow screens use two rows of large buttons. Joining a family does not require creating a separate local pet. Optional shared profiles and diaries use private invitation codes; existing private histories and local reminders are not automatically synchronized. App entry remains immediate without a code or birthday.
          Physical phone reminder acceptance and production Firebase moderator access remain pending. Cloud media and background chat push remain disabled pending owner backend configuration and billing. This download is not a Google Play approval or registration.
          Install over the existing app without uninstalling it. ZIP is an alternative download containing the same APK.
          EOF
          gh release create v1.8.9 Pet-Care-World-1.8.9.apk Pet-Care-World-1.8.9.zip Play-Submission-1.8.9.zip SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Pet Care World 1.8.9 — family care in main navigation' --notes-file release-notes.txt
