name: Build Pet Care Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Check web assets
        run: npm run check:web
      - name: Check JavaScript dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Android assets
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: bash gradlew assembleDebug --no-daemon
      - name: Record APK SHA-256 checksum
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pet-care-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
