name: Pet Care deletion operations rehearsal
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/test-account-deletion-rehearsal.mjs'
      - '.github/workflows/operational-readiness.yml'
permissions:
  contents: read
jobs:
  deletion-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated emulator tools
        run: npm install --no-save firebase-admin@14.5.0 firebase-tools@14
      - name: Rehearse deletion without credentials or production access
        run: npx firebase emulators:exec --config firebase.no-chat.json --only auth,firestore --project demo-petcare-ops 'node tools/test-account-deletion-rehearsal.mjs'
