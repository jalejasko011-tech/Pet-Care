name: Pet Care quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Check web app
        run: npm run check:web
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test user flows in mobile browser
        run: node tools/test-browser.mjs
