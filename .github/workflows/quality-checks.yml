name: Pet Care quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Check web app
        run: npm run check:web
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test user flows in mobile browser
        run: node tools/test-browser.mjs
      - name: Preserve mobile appearance preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-appearance-preview
          path: pet-care-background-preview.png
          retention-days: 7

  android-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Android test package
        run: |
          npm install
          npm run check:web
          npx cap add android
          node tools/configure-android.mjs
          npx cap sync android
          cd android
          bash gradlew assembleDebug --no-daemon
      - name: Install Android WebView test driver
        run: npm install --no-save playwright
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on Android 36 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash tools/android-smoke.sh
      - name: Preserve Android test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-evidence
          path: android-test-evidence/
          retention-days: 7

  chat-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase test tools
        run: npm install --no-save firebase@12.4.0 @firebase/rules-unit-testing@5 firebase-tools@14
      - name: Verify global chat access and moderation rules
        run: npx firebase emulators:exec --only firestore --project demo-petcare-chat 'node tools/test-chat-rules.mjs'
