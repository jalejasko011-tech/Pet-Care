name: Build signed Pet Care Android AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'tools/**'
      - '.github/workflows/pet-care-android-release.yml'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing signing secret: $name"
              exit 1
            fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and validate
        run: |
          npm install
          npm run check:web
          npm audit --omit=dev --audit-level=high
      - name: Prepare Firebase web configuration from Android JSON
        env:
          FIREBASE_CONFIG_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          python3 - <<'PY'
          import os,base64,json
          from pathlib import Path
          encoded=os.getenv('FIREBASE_CONFIG_BASE64','')
          config={}
          if encoded:
              raw=json.loads(base64.b64decode(encoded))
              client=next((c for c in raw.get('client',[]) if c.get('client_info',{}).get('android_client_info',{}).get('package_name')=='com.petcare.companion'),None)
              if not client:
                  raise SystemExit('Firebase Android client com.petcare.companion not found')
              key=next((k.get('current_key') for k in client.get('api_key',[]) if k.get('current_key')),None)
              info=raw['project_info']
              config={'apiKey':key,'projectId':info['project_id'],'appId':client['client_info']['mobilesdk_app_id'],
                      'authDomain':info['project_id']+'.firebaseapp.com'}
              if info.get('storage_bucket'):config['storageBucket']=info['storage_bucket']
          Path('www/firebase-config.js').write_text('window.PETCARE_FIREBASE_CONFIG = '+json.dumps(config)+';\n')
          print('Firebase config prepared' if config else 'Firebase config missing; cloud sync disabled')
          PY
      - name: Generate Android project
        run: |
          npx cap add android
          node tools/configure-android.mjs
          npx cap sync android
      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pet-care-upload.jks"
          {
            echo "PETCARE_STORE_FILE=$RUNNER_TEMP/pet-care-upload.jks"
            echo "PETCARE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "PETCARE_KEY_ALIAS=$KEY_ALIAS"
            echo "PETCARE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Configure release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          if 'signingConfigs {' in s:
              raise SystemExit('Existing signing configuration requires manual review')
          marker = 'android {'
          if marker not in s:
              raise SystemExit('Android Gradle block missing')
          config = """android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv('PETCARE_STORE_FILE'))
                      storePassword System.getenv('PETCARE_STORE_PASSWORD')
                      keyAlias System.getenv('PETCARE_KEY_ALIAS')
                      keyPassword System.getenv('PETCARE_KEY_PASSWORD')
                  }
              }
          """
          s = s.replace(marker, config, 1)
          import re
          pattern = r'(buildTypes\s*\{\s*release\s*\{)'
          if not re.search(pattern, s):
              raise SystemExit('Existing release buildType missing')
          s = re.sub(pattern, r'\1\n            signingConfig signingConfigs.release', s, count=1)
          p.write_text(s)
          PY
      - name: Build signed release AAB
        working-directory: android
        run: bash gradlew bundleRelease --no-daemon
      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: pet-care-signed-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
